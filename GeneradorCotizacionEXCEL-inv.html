<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generador  .xls/.xlsx — INGETES</title>
<style>
  /* Paleta clara tipo “dashboard” */
  :root{
    --bg:#f6f8fb;          /* fondo generaaal */
    --card:#ffffff;        /* tarjetas / contenedores */
    --border:#e5e7eb;      /* líneas y bordes suaves */
    --muted:#6b7280;       /* texto secundario */
    --text:#0b1020;        /* texto principal */
    --input-bg:#ffffff;    /* fondo de inputs */
    --input-border:#d1d5db;/* borde de inputs */
    --input-placeholder:#9ca3af;
    --btn:#111827;         /* botón oscuro (Industry Mall) */
    --btn-border:#0b0f19;
    --btn-text:#ffffff;
    --pill-bg:#eef2f7;     /* chips/pastillas de estado */
    --pill-text:#111827;
    --table-head:#f1f5f9;  /* encabezado de tablas */
  }

/* Colores de estado SOLO en el texto */
.table-preview td.ok{
  background:transparent;
  color:#065f46;   /* verde */
  font-weight:700;
}
.table-preview td.warn{
  background:transparent;
  color:#b45309;   /* amarillo/naranja */
  font-weight:700;
}
.table-preview td.bad{
  background:transparent;
  color:#991b1b;   /* rojo */
  font-weight:700;
}

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* Encabezado claro con borde sutil */
  header{
    padding:24px 16px;
    border-bottom:1px solid var(--border);
    background:#ffffff;
  }

  label.required::after {
    content: " *";
    color: #dc2626;
  }

  h1{margin:0;font-size:24px;font-weight:800;color:var(--text)}

  main{max-width:1100px;margin:0 auto;padding:24px 16px}

  .grid{display:grid;gap:16px}
  .two{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:900px){.two{grid-template-columns:1fr}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
  }
  .pad{padding:16px}

  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }

  input,select,textarea{
    width:100%;
    padding:10px 12px;
    background:var(--input-bg);
    color:var(--text);
    border:1px solid var(--input-border);
    border-radius:10px;
    outline:none;
  }
  input::placeholder, textarea::placeholder{color:var(--input-placeholder)}
  input[type=file]{padding:10px;background:var(--card)}

  /* Estados de foco accesibles */
  input:focus, select:focus, textarea:focus{
    border-color:#9aa7b4;
    box-shadow:0 0 0 3px rgba(2,132,199,.15);
  }

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* Botones: primario negro como en la imagen */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 14px;border-radius:12px;
    border:1px solid var(--border);
    background:#f3f4f6;color:var(--text);
    cursor:pointer;font-weight:600;
  }
  .btn.primary{
    background:var(--btn);
    color:var(--btn-text);
    border-color:var(--btn-border);
  }
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:hover{background:#eef1f5}

  /* Chips/píldoras de estado en claro */
  .pill{
    display:inline-block;padding:4px 10px;border-radius:999px;
    background:var(--pill-bg);border:1px solid var(--border);
    font-size:12px;color:var(--pill-text);
  }

  /* Tablas en claro */
  .table-preview{width:100%;border-collapse:collapse;background:#fff}
  .table-preview th,.table-preview td{
    border:1px solid var(--border);
    padding:6px 8px;font-size:12px;color:var(--text);
  }
  .table-preview th{
    background:var(--table-head);
    color:#111827;
    font-weight:700;
  }

  /* Select con mismo estilo que input */
  .select{
    width:100%;
    padding:10px 12px;
    background:var(--input-bg);
    color:var(--text);
    border:1px solid var(--input-border);
    border-radius:10px;
  }

/* Borde rojo para campos obligatorios vacíos */
.input-error{
  border-color:#dc2626 !important;
  box-shadow:0 0 0 2px rgba(220,38,38,.20) !important;
}

.combo-input{
  width:100%;
  margin-bottom:8px;
  padding:10px 12px;
  background:var(--input-bg);
  color:var(--text);
  border:1px solid var(--input-border);
  border-radius:10px;
  outline:none;
}
.combo-input:focus{
  border-color:#9aa7b4;
  box-shadow:0 0 0 3px rgba(2,132,199,.15);
}
.hidden{ display:none !important; }

</style>

</head>

  <script>
  // ===== Utilidades / carga =====
  const $ = (s)=>document.querySelector(s);
  const statusEl = () => $('#status');
  function setStatus(t){ if(statusEl()) statusEl().textContent=t; }
  function setEngineInfo(html, cls){ const el=$('#engineInfo'); if(el) el.innerHTML = `<span class="${cls||''}">${html}</span>`; }
  async function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.defer=true; s.crossOrigin='anonymous'; s.onload=()=>res(); s.onerror=()=>rej(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
  async function ensureXLSX(){ if(window.XLSX) return; for(const u of ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']){ try{ await loadScript(u); break; }catch{} } if(!window.XLSX) throw new Error('SheetJS no se pudo cargar'); }
async function ensureExcelJS(){
  if(window.ExcelJS) return;
  for(const u of [
    'https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js',
    'https://unpkg.com/exceljs@4.3.0/dist/exceljs.min.js'
  ]){
    try{ await loadScript(u); break; }catch{}
  }
  if(!window.ExcelJS) throw new Error('ExcelJS no se pudo cargar');
}

// ====== Estado Inventario/Cotización (para comparar) ======
let invMap = new Map();     // refN -> { raw, descripcion, cantidad }
let cotMap = new Map();     // refN -> { req }
let cotOrder = [];          // para pintar en orden en la tabla
let invFileBuffer = null; // buffer del archivo de inventario subido

const normRef = s => String(s||'')
  .replace(/\u00A0/g,' ')
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .replace(/[‐-‒–—−]/g,'-')
  .replace(/\s*-\s*/g,'-')
  .replace(/\s+/g,' ')
  .trim()
  .toUpperCase();

function parseQty(v){
  if (typeof v === 'number') return Math.round(v);
  let s = String(v ?? '').replace(/\u00A0/g,' ').trim();
  if (!s) return 0;
  s = s.replace(/\.(?=\d{3}(?:\D|$))/g,'');
  s = s.replace(/,(?=\d{3}(?:\D|$))/g,'');
  s = s.replace(/,(\d{1,2})$/,'.$1');
  const m = s.match(/-?\d+(?:\.\d+)?/);
  return m ? Math.round(Number(m[0])) : 0;
}

function pickSheetByNameLike(wb, names){
  const want = names.map(n=>n.toUpperCase());
  for(const n of wb.SheetNames){ if(want.includes(n.toUpperCase())) return n; }
  return wb.SheetNames[0];
}

  let parsedRows=[], headers=[];
(async function init(){ 
  try{ 
    setStatus('Cargando librerías…'); 
    await ensureXLSX(); 
    await ensureExcelJS(); 
    setStatus('Listo. Carga tu archivo.'); 
  }catch(e){ 
    setStatus('Error al iniciar'); 
    setEngineInfo(e.message,'error'); 
  } 
  bindEvents(); 
  updateOutName();
  // === Carga automática del Excel de contactos (igual que en Word) ===
  tryAutoLoadContactsFromFolder();
})();

  function limitYearDigits(input) {
    if (input.value.length > 2) {
      input.value = input.value.slice(0, 2);
    }
    
    // También actualiza el nombre de salida
    updateOutName();
  }

  function limitDescuento(input) {
  // Convierte el valor en número y valida límites
  const val = parseFloat(input.value);
  if (isNaN(val)) return;

  if (val > 4) {
    input.value = 4;
    // Mostrar aviso visual discreto (sin alert)
    input.style.borderColor = "#dc2626";
    input.style.boxShadow = "0 0 0 2px rgba(220,38,38,.25)";
    const msg = document.getElementById("descMsg");
    if (msg) {
      msg.textContent = "Máximo permitido: 4%";
      msg.style.color = "#dc2626";
    }
  } else {
    input.style.borderColor = "";
    input.style.boxShadow = "";
    const msg = document.getElementById("descMsg");
    if (msg) msg.textContent = "";
  }
}

// ====== Contactos (empresa) ======
let CONTACTS_DB = { byEmpresa: new Map(), all: [] };

function _normStr(s){ return (s||'').toString().trim(); }
function _normKey(s){
  return _normStr(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

async function parseContactsWorkbook(arrayBuffer){
  await ensureXLSX();
  const wb = XLSX.read(arrayBuffer, { type:'array', cellStyles:false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) throw new Error('No se encontró hoja de contactos');

  const range = XLSX.utils.decode_range(ws['!ref']||'A1');
  const getCell = (r,c) => {
    const a = XLSX.utils.encode_cell({r,c});
    const cell = ws[a];
    if(!cell) return '';
    if(typeof cell.w === 'string') return cell.w;
    return cell.v==null ? '' : String(cell.v);
  };

  // 1) Buscar encabezados (normalizados)
  let headerRow = -1, cols = {};
  for(let r=range.s.r; r<=range.e.r; r++){
    const names = [];
    for(let c=range.s.c; c<=range.e.c; c++) names.push(_normKey(getCell(r,c)));
    const idxEmpresa = names.findIndex(v => v.includes('nombre de la cuenta'));
    if (idxEmpresa>=0){
      headerRow = r;
      cols = { empresa: idxEmpresa };
      break;
    }
  }
  if(headerRow < 0) throw new Error('No se detectó columna "Nombre de la cuenta"');

  // 2) Recorrer filas con “arrastre” de empresa, saltando subtotales
  const rows = [];
  let lastEmpresa = '';
  for(let r=headerRow+1; r<=range.e.r; r++){
    const vEmpresa = _normStr(getCell(r, cols.empresa));
    const line = (vEmpresa||'').toLowerCase();
    if (line.includes('subtotal')) continue;

    if (vEmpresa) lastEmpresa = vEmpresa;
    const empresa = lastEmpresa;
    if (!empresa) continue;

    rows.push({ empresa });
  }

  // 3) Agrupar por empresa
  const byEmpresa = new Map();
  rows.forEach(r=>{
    if(!byEmpresa.has(r.empresa)) byEmpresa.set(r.empresa, []);
    byEmpresa.get(r.empresa).push(r);
  });

  return { byEmpresa, all: rows };
}

// Llena el select con las empresas
function fillClienteOptions(){
  const sel = document.getElementById('clienteSelect');
  if(!sel) return;
  sel.innerHTML = '<option value="" selected disabled>-Seleccionar empresa-</option>';

  const empresas = Array.from(CONTACTS_DB.byEmpresa.keys())
                        .sort((a,b)=>a.localeCompare(b,'es'));
  empresas.forEach(e=>{
    const opt = document.createElement('option');
    opt.value = e.toUpperCase();
    opt.textContent = e.toUpperCase();
    sel.appendChild(opt);
  });

  const st = document.getElementById('xlsDatosStatus');
  if (st) st.textContent = `Empresas: ${empresas.length}`;
}

function hideContactsUploadUI(){
  const row = document.getElementById('xlsDatosRow');
  if (row) row.style.display = 'none';
}

// Intenta cargar automáticamente el Excel de contactos desde la misma carpeta
async function tryAutoLoadContactsFromFolder(){
  // rutas candidatas relativas a este HTML (ajusta si usas otra subcarpeta)
  const CANDIDATES = [
    'CONTACTOS.xlsx','Contactos.xlsx','contactos.xlsx',
    'CLIENTES.xlsx','informedeContactos.xlsx'
  ];

  for (const rel of CANDIDATES){
    try{
      const url = new URL(rel, location.href).href + `?v=${Date.now()}`; // evita caché
      const resp = await fetch(url, { cache:'no-store' });
      if (!resp.ok) continue;

      const buf = await resp.arrayBuffer();
      // Si pesa "algo", lo intentamos parsear
      if (buf.byteLength < 1024) continue;

      CONTACTS_DB = await parseContactsWorkbook(buf);
      if (CONTACTS_DB?.byEmpresa?.size){
        fillClienteOptions();
        hideContactsUploadUI();                        // oculta el cargador "Excel datos de contacto"
        const st = document.getElementById('xlsDatosStatus');
        if (st) st.textContent = `Empresas: ${CONTACTS_DB.byEmpresa.size} (carga automática)`;
        return true;
      }
    }catch(_){ /* intenta con el siguiente */ }
  }
  return false;
}

// Sincroniza el input #cliente desde el select
function syncClienteFromSelect(){
  const sel = document.getElementById('clienteSelect');
  const inp = document.getElementById('cliente');
  const opt = sel && sel.selectedOptions[0];
  if (opt && inp) inp.value = (opt.textContent || opt.value || '').toUpperCase();
}

// Combo buscable (igual al del Word, simplificado)
function attachSearchableCombo(selectId, inputId, { onCommit, matchMode='startsWith' } = {}){
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if (!sel || !inp) return;

  let customOpt = sel.querySelector('option[data-custom="1"]') || null;
  const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();

  function resetFilter(){ Array.from(sel.options).forEach(o=>o.hidden=false); }
  function filterOptions(q){
    const Q = norm(q);
    Array.from(sel.options).forEach((opt, idx)=>{
      const txt = norm(opt.textContent||opt.value||'');
      if (idx===0 && opt.disabled){ opt.hidden=false; return; }
      if (!Q){ opt.hidden=false; return; }
      opt.hidden = (matchMode==='startsWith') ? !txt.startsWith(Q) : !txt.includes(Q);
    });
  }
  function commitFreeTextToSelect(){
    const valTyped = norm(inp.value);
    if (!valTyped) return '';
    const exact = Array.from(sel.options).find(o => norm(o.textContent||o.value||'') === valTyped);
    if (exact){ sel.value = exact.value; return (exact.textContent||exact.value||'').toUpperCase(); }
    if (!customOpt || !sel.contains(customOpt)) {
      customOpt = document.createElement('option');
      customOpt.dataset.custom='1';
      sel.appendChild(customOpt);
    }
    customOpt.value = valTyped;
    customOpt.textContent = valTyped;
    customOpt.hidden = false;
    sel.value = customOpt.value;
    return valTyped;
  }

  sel.addEventListener('change', ()=>{ syncClienteFromSelect(); if (onCommit) onCommit(); });
  inp.addEventListener('input', ()=>{
    const pos = inp.selectionStart;
    inp.value = inp.value.toUpperCase();
    if (typeof pos === 'number') inp.setSelectionRange(pos,pos);
    resetFilter(); filterOptions(inp.value);
  });
  inp.addEventListener('keydown', (e)=>{
    if (e.key==='Enter'){ e.preventDefault(); const v=commitFreeTextToSelect(); if (v) inp.value=v; if (onCommit) onCommit(); }
  });
  inp.addEventListener('blur', ()=>{ const v=commitFreeTextToSelect(); if (v) inp.value=v; if (onCommit) onCommit(); });
}

function wireContactsInput(){
  const up = document.getElementById('xlsDatos');
  if (!up) return;

  up.addEventListener('change', async ()=>{
    const f = up.files && up.files[0];
    if (!f){
      CONTACTS_DB = {byEmpresa:new Map(), all:[]};
      fillClienteOptions();
      return;
    }
    try{
      const buf = await f.arrayBuffer();
      CONTACTS_DB = await parseContactsWorkbook(buf);
      fillClienteOptions();

      // 👇 Oculta el bloque de subida cuando ya hay empresas
      if (CONTACTS_DB.byEmpresa && CONTACTS_DB.byEmpresa.size) {
        hideContactsUploadUI();
      }
    }catch(e){
      console.error(e);
      alert('No se pudo leer el Excel de contactos: ' + (e.message||e));
    }
  });

  // permitir re-subir el mismo archivo
  up.addEventListener('click', e => { e.currentTarget.value=''; });
}

  function bindEvents(){ 
// Mall: lee, muestra preview y construye cotMap usando detectMallCols()
$('#fileMall').addEventListener('change', async (ev)=>{
  const f=ev.target.files?.[0]; if(!f) return;
  $('#fileMallInfo').textContent=`${f.name} • ${(f.size/1024/1024).toFixed(2)} MB`;

  const data = await f.arrayBuffer();

  const stripAccents=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function autoMap(){
    const cols=headers.map(h=>({raw:h, n:norm(h)}));
    const find=(arr)=>{const hit=cols.find(c=>arr.some(p=>c.n.includes(norm(p)))); return hit?hit.raw:null};
    return {
      referencia: find(['id de material','id material','material','referencia']),

      descuento:  find(['descuento (%)','descuento','discount']),
      fecha:      find(['fecha de entrega estimada','entrega estimada','estimated delivery','delivery'])
    };
  }
  const toNum=v=>{ if(typeof v==='number')return v; const s=String(v).replace(/[^0-9,.-]/g,'').replace(/,(?=\d{3}(\D|$))/g,'').replace(',', '.'); const n=parseFloat(s); return isFinite(n)?n:0; };
  function toDate(v){
    if(!v) return null;
    if(typeof v==='number'){ const epoch=new Date(1899,11,30); const d=new Date(epoch.getTime()+v*86400000); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
    const s=String(v).trim(); if(!s) return null;
    function digits(str){ let buf='', out=[]; for(const ch of str){ if(ch>='0'&&ch<='9') buf+=ch; else { if(buf){ out.push(buf); buf=''; } } } if(buf) out.push(buf); return out; }
    const p=digits(s);
    if(p.length>=3){
      let y,m,d;
      if(p[0].length===4){ y=+p[0]; m=+p[1]-1; d=+p[2]; }
      else { d=+p[0]; m=+p[1]-1; y=+p[2]; if(y<100) y+=2000; }
      const dt=new Date(y,m,d); if(dt && dt.getMonth()===m && dt.getDate()===d) return dt;
    }
    const d2=new Date(s); if(!isNaN(d2)) return new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
    return null;
  }
    
  function disponibilidad(val){
    const d=toDate(val); if(!d) return '';
    const t=new Date(); t.setHours(0,0,0,0);
    const diff=Math.floor((d - t)/86400000);
    if(diff <= 6) return '3-5 días. Salvo venta previa';
    if(diff >= 7 && diff <= 45) return '30-45 días. Salvo venta previa';
    if(diff >= 46 && diff <= 60) return '6-8 semanas';
    if(diff >= 61 && diff <= 80) return '8-10 semanas';
    if(diff >= 81 && diff <= 100) return '10-12 semanas';
    return `${diff} días`;
  }

          }]
        });
        
        // Crear un stream para escribir el archivo
        const writable = await handle.createWritable();

        console.log('Archivo guardado exitosamente');

    return false;
  } catch (error) {

    return false;
  }
}

// Detecta columnas del Mall (Referencia/Cantidad/Descripción) con sinónimos y coincidencia parcial
function detectMallCols(ws){
  const range = XLSX.utils.decode_range(ws['!ref']);
  const maxR = Math.min(range.s.r + 15, range.e.r);
  const maxC = Math.min(range.s.c + 30, range.e.c);

  // Sinónimos “fuertes”
  const refStrong = [
    'ID DE MATERIAL','ID MATERIAL','MATERIAL',
    'NUMERO ART','NÚMERO ART','MFN','REFERENCIA','MATERIAL ID','MATERIAL NO','MATERIAL NUMBER'
  ];
  const qtyStrong = [
    'CANTIDAD','CANT','QTY','QUANTITY','CANTIDAD SOLICITADA','QTY ORDERED','ORDER QTY'
  ];

  let headerRow = range.s.r, colRef=null, colQty=null, colDesc=null;
  let colOpts = null;

  // 1) Buscar coincidencias fuertes o parciales (ej: "ID DE MATERI")
  const hitRef = t => {
    if (!t) return false;
    // preferencia: si empieza por "ID DE MATERI" o contiene "MATERIAL"
    if (t.startsWith('ID DE MATERI')) return true;
    if (t.includes('MATERIAL')) return true;
    return refStrong.some(k => t.includes(k));
  };
  const hitQty = t => qtyStrong.some(k => t.includes(k));

for (let r = range.s.r; r <= maxR; r++){
  for (let c = range.s.c; c <= maxC; c++){
    const t = H(ws[XLSX.utils.encode_cell({r,c})]?.v);
    if (!t) continue;

    if (colOpts === null && t.includes('OPCION')) {
      colOpts = c;
      headerRow = r;
    }
    if (colRef === null && hitRef(t)) { colRef = c; headerRow = r; }
    if (colQty === null && hitQty(t)) { colQty = c; headerRow = r; }
    if (colDesc === null && (t.includes('DESCRIPCION') || t.includes('DESCRIPTION'))) {
      colDesc = c; headerRow = r;
    }
  }
  if (colRef !== null && colQty !== null) break;
}

  // 2) Fallback: tomar primera/segunda columna si no se encontró nada
  if (colRef === null) colRef = range.s.c;
  if (colQty === null) colQty = Math.min(range.s.c + 1, range.e.c);

  return { headerRow, colRef, colQty, colDesc, colOpts };

}

// --- Detecta columnas del INVENTARIO (Referencia/Descripción/Cantidad) ---
// --- Detecta columnas del INVENTARIO (Referencia/Descripción/Cantidad/Marca) ---
function detectInvCols(ws){
  const range = XLSX.utils.decode_range(ws['!ref']);
  const maxR = Math.min(range.s.r + 15, range.e.r);
  const maxC = Math.min(range.s.c + 30, range.e.c);
  let headerRow = range.s.r, colRef = null, colDesc=null, colQty = null, colMarca=null;

  const H = s => String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036F]/g,'');

  for (let r=range.s.r; r<=maxR; r++){
    for (let c=range.s.c; c<=maxC; c++){
      const t = H(ws[XLSX.utils.encode_cell({r,c})]?.v);
      if (!t) continue;
      if (colRef  === null && (t.includes('REFERENCIA') || t.includes('MATERIAL'))) { colRef=c; headerRow=r; }
      if (colDesc === null && (t.includes('DESCRIPCION') || t.includes('DESCRIPTION'))) { colDesc=c; headerRow=r; }
      if (colQty  === null && (t.includes('CANTIDAD') || t === 'QTY' || t === 'QUANTITY')) { colQty=c; headerRow=r; }
      if (colMarca=== null && (t.includes('MARCA') || t.includes('BRAND'))) { colMarca=c; headerRow=r; }
    }
  }

  // Fallbacks conservadores
  if (colRef  === null) colRef  = range.s.c;
  if (colDesc === null) colDesc = Math.min(range.s.c+2, range.e.c);
  if (colQty  === null) colQty  = Math.min(range.s.c+3, range.e.c);
  // colMarca puede quedar null si no existe

  return { headerRow, colRef, colDesc, colQty, colMarca };
}

// Busca el bloque "INVENTARIO REGULAR/OEMS/MIGRACION" y devuelve filas inicio/fin
function findInvSection(ws, tipo){
  if (tipo === 'TODO') return null; // "Todo" se maneja aparte

  const range = XLSX.utils.decode_range(ws['!ref']);
  const H = s => String(s||'')
      .trim()
      .toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // sin acentos

  const title = `INVENTARIO ${tipo}`; // p.ej. INVENTARIO REGULAR

  let titleRow = null;
  for (let r = range.s.r; r <= range.e.r; r++){
    const v = H(ws[XLSX.utils.encode_cell({ r, c: range.s.c })]?.v);
    if (v === title){ titleRow = r; break; }
  }
  if (titleRow == null) return null;

  const headerRow = titleRow + 1; // la fila de encabezados
  let endRow = range.e.r;
  for (let r = headerRow + 1; r <= range.e.r; r++){
    const v = H(ws[XLSX.utils.encode_cell({ r, c: range.s.c })]?.v);
    if (v.startsWith('INVENTARIO ')){ endRow = r - 1; break; } // siguiente bloque
  }
  return { headerRow, endRow };
}

// Parsea SOLO la sección elegida y llena el Map de inventario
function parseInvForSection(ws, tipo){
  const sect = findInvSection(ws, tipo);
  const map = new Map();
  if (!sect) return map;

  // Reutiliza detectInvCols para saber qué columnas son REFE/DESC/CANT/MARCA
  const { headerRow, endRow } = sect;
  const { colRef, colDesc, colQty, colMarca } = detectInvCols(ws);

  for (let r = headerRow + 1; r <= endRow; r++){
    const raw   = String(ws[XLSX.utils.encode_cell({ r, c: colRef })]?.v ?? '').trim();
    const refN  = normRef(raw); if (!refN) continue;

    const desc  = String(ws[XLSX.utils.encode_cell({ r, c: colDesc })]?.v ?? '').trim();
    const qty   = parseQty(ws[XLSX.utils.encode_cell({ r, c: colQty })]?.v ?? 0);
    const marca = (colMarca != null)
      ? String(ws[XLSX.utils.encode_cell({ r, c: colMarca })]?.v ?? '').trim()
      : '';

    map.set(refN, { raw, descripcion: desc, cantidad: qty, marca });
  }
  return map;
}

// Suma cantidades de REGULAR + OEMS + MIGRACION
function parseInvSumAll(ws){
  const out = new Map();
  ['REGULAR','OEMS','MIGRACION'].forEach(tipo=>{
    const part = parseInvForSection(ws, tipo);
    part.forEach((v, k)=>{
      const prev = out.get(k);
      out.set(k, {
        raw: prev?.raw || v.raw,
        descripcion: prev?.descripcion || v.descripcion,
        cantidad: (prev?.cantidad || 0) + (Number(v.cantidad)||0),
        marca: prev?.marca || v.marca
      });
    });
  });
  return out;
}

// Forzar ajuste de texto (wrapText) en todas las celdas de una hoja
function wrapAll(ws){
  ws.eachRow({ includeEmpty: true }, (row) => {
    row.eachCell({ includeEmpty: true }, (cell) => {
      const prev = cell.alignment || {};
      cell.alignment = { ...prev, wrapText: true };
    });
  });
}

async function generateExcel(){
// === Librerías necesarias (cargar y luego tomar los globales) ===
if (window.ensureXLSX)   { try { await ensureXLSX();   } catch(e){} }
if (window.ensureExcelJS){ try { await ensureExcelJS();} catch(e){} }

const XLSX    = window.XLSX;
const ExcelJS = window.ExcelJS;

if (!XLSX || !ExcelJS) {
  alert('No se pudieron cargar las librerías XLSX/ExcelJS');

    // LOCATIVO (B2)
    const locHeaders=['ITEM','# PARTE','REFERENCIA','CANT','DESCRIPCION','DISPONIBILIDAD','PRECIO LISTA','BOTÓN','% DESC.','EXISTENCIA','V/COSTO','FACT. UTILIDAD','V/UNIT VENTA','V/TOTAL'];
    const locData=[ ['','TABLA DE COSTOS'], [], ['',`CLIENTE: ${meta.cliente||''}`], ['',`FECHA DE ELABORACIÓN COTIZACIÓN: ${meta.fechaElab||''}`], ['',`O.C ANTERIOR DEL CLIENTE:                                                                                              FECHA:`], ['',`O.C ACTUAL DEL CLIENTE:                                                                                                   FECHA:`], [], ['',...locHeaders],
      ...items.map(it=>['',it.item,'',it.referencia,it.cant,it.descripcion,it.disponibilidad,it.precioLista,it.boton,it.dcto/100,'',null,it.factorUtil,null,null])
    ];
    const wsLoc=XLSX.utils.aoa_to_sheet(locData);
    wsLoc['!merges']=[
      XLSX.utils.decode_range('B2:O2'),
      XLSX.utils.decode_range('B4:I4'),
      XLSX.utils.decode_range('B5:I5'),
      XLSX.utils.decode_range('B6:I6'),
      XLSX.utils.decode_range('B7:I7'),
    ];
    wsLoc['!cols']=[{wch:3},{wch:6},{wch:9},{wch:20},{wch:8},{wch:46},{wch:22},{wch:14},{wch:10},{wch:10},{wch:12},{wch:14},{wch:14},{wch:16},{wch:16}];
    const startData=10;
    items.forEach((it,i)=>{ 
  const r=startData+i;
  // Estado (misma lógica del aplicativo) en columna J
const inv = invMap.get(normRef(it.referencia));
const stock = Number(inv?.cantidad || 0);
let estado = 'NO EN INVENTARIO';
if (stock > 0 && stock < it.cant) estado = 'EN INVENTARIO (NO ALCANZA)';
if (stock >= it.cant && it.cant > 0) estado = 'EN INVENTARIO';
wsLoc['J'+r] = { t:'s', v: estado };

  // MODIFICAR ESTAS LÍNEAS - Sumar el envío directamente en la fórmula
  if (it.envio > 0) {
    wsLoc['N'+r]={t:'n',f:`CEILING((L${r}*M${r})+${it.envio},100)`};
  } else {
    wsLoc['N'+r]={t:'n',f:`CEILING(L${r}*M${r}+0,100)`};
  }
  
  wsLoc['O'+r]={t:'n',f:`CEILING(N${r}*E${r},100)`}; 
  wsLoc['L'+r]={t:'n',f:`CEILING(H${r}*(1 - J${r}),100)`}; 
});

// === Fila ENVÍO en fallback SheetJS (H..K en la misma fila frDesc)
const totalQtyRange = `E${startData}:E${startData + items.length - 1}`;

wsLoc['H' + frDesc] = { t:'s', v:'ENVÍO POR ÍTEM:' };
wsLoc['I' + frDesc] = { t:'n', v:(parseFloat($('#envio').value || '0') || 0) };
wsLoc['I' + frDesc].z = '"$" #,##0';

wsLoc['J' + frDesc] = { t:'s', v:'TOTAL ENVÍO:' };
wsLoc['K' + frDesc] = { t:'n', f:`I${frDesc}*SUM(${totalQtyRange})` };
wsLoc['K' + frDesc].z = '"$" #,##0';

    XLSX.utils.book_append_sheet(wb, wsLoc, 'LOCATIVO');

    // VENTA (D4) + fila amarilla (sin estilos avanzados en fallback)
    const wsVen=XLSX.utils.aoa_to_sheet([]);
    wsVen['!merges']=[XLSX.utils.decode_range('D3:I3')];
    XLSX.utils.sheet_add_aoa(wsVen, [['ITEM','CANT','DESCRIPCION','V/UNIT','V/TOTAL']], {origin:'D4'});
    items.forEach((it,i)=>{
      const r=5+i, loc=10+i;
      const desc = cfg.showRef
      ? `${it.descripcion}\nRef: ${it.referencia}\nDisponibilidad: ${it.disponibilidad}`
      : `${it.descripcion}\nDisponibilidad: ${it.disponibilidad}`;
      XLSX.utils.sheet_add_aoa(wsVen, [
        [
          {f:`LOCATIVO!B${loc}`},  // ITEM (columna C en LOCATIVO)
          {f:`LOCATIVO!E${loc}`},  // CANT (columna E en LOCATIVO)
          desc, 
          {f:`LOCATIVO!N${loc}`},
          {f:`LOCATIVO!O${loc}`}
        ]
      ], {origin:`D${r}`} );
    });
  
    const last=4+items.length;

    if((cfg.descuentoPct||0)>0){
      const rowSub=last+1, rowDesc=rowSub+1, rowTot=rowDesc+1, rowIva=rowTot+1;
      wsVen['!merges']=wsVen['!merges'].concat([
        XLSX.utils.decode_range(`D${rowSub}:G${rowSub}`),
        XLSX.utils.decode_range(`D${rowDesc}:G${rowDesc}`),
        XLSX.utils.decode_range(`D${rowTot}:G${rowTot}`),
        XLSX.utils.decode_range(`D${rowIva}:H${rowIva}`)
      ]);
      XLSX.utils.sheet_add_aoa(wsVen, [[ 'SUBTOTAL', null,null,null, {f:`SUM(H5:H${last})`} ]], {origin:`D${rowSub}`} );
      XLSX.utils.sheet_add_aoa(wsVen, [[ `DESCUENTO (${Math.round((cfg.descuentoPct||0)*100)}%)`, null,null,null, {f:`H${rowSub}*${(cfg.descuentoPct||0)}`} ]], {origin:`D${rowDesc}`} );
      XLSX.utils.sheet_add_aoa(wsVen, [[ 'TOTAL', null,null,null, {f:`H${rowSub}-H${rowDesc}`} ]], {origin:`D${rowTot}`} );
      XLSX.utils.sheet_add_aoa(wsVen, [[ 'IVA NO INCLUIDO' ]], {origin:`D${rowIva}`} );
    } else {
      const rowTot=last+1, rowIva=rowTot+1;
      wsVen['!merges']=wsVen['!merges'].concat([
        XLSX.utils.decode_range(`D${rowTot}:G${rowTot}`),
        XLSX.utils.decode_range(`D${rowIva}:H${rowIva}`)
      ]);
      XLSX.utils.sheet_add_aoa(wsVen, [[ 'TOTAL', null,null,null, {f:`SUM(H5:H${last})`} ]], {origin:`D${rowTot}`} );
      XLSX.utils.sheet_add_aoa(wsVen, [[ 'IVA NO INCLUIDO' ]], {origin:`D${rowIva}`} );
    }
    wsVen['!cols']=[{wch:3},{wch:3},{wch:3},{wch:6},{wch:8},{wch:75},{wch:22},{wch:18},{wch:18}];

    XLSX.utils.book_append_sheet(wb, wsVen, 'VENTA');
    return wb;
  }
  </script>
