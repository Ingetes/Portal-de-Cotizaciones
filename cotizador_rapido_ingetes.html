<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador rápido INGETES</title>
    <!-- Fonts + estilos globales (idéntico al Excel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script> 
  <style>
    :root{
      --bg:#f6f8fb; --card:#ffffff; --border:#e5e7eb; --muted:#6b7280; --text:#0b1020;
      --btn-bg:#f3f4f6; --btn-bg-hover:#eef1f5; --pill-bg:#eef2f7;
    }
    body{ font-family: Inter,system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .app-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
    input, select, textarea{ background:#fff; border:1px solid #d1d5db; border-radius:10px; outline:none; }
    input:focus, select:focus, textarea:focus{ border-color:#9aa7b4; box-shadow:0 0 0 3px rgba(2,132,199,.15); }
    label{ color:var(--muted); }
    .btn-soft{ display:inline-flex; align-items:center; gap:.5rem; padding:.6rem .9rem; border-radius:12px; border:1px solid var(--border); background:var(--btn-bg); color:var(--text); font-weight:600; }
    .btn-soft:hover{ background:var(--btn-bg-hover); }
    .btn-soft.primary{ background:var(--btn-bg); border-color:var(--border); color:var(--text); }
    .pill{ display:inline-block; padding:4px 10px; border-radius:999px; background:var(--pill-bg); border:1px solid var(--border); font-size:12px; color:#111827; }
 
.ref-grid{
  display:grid;
  grid-template-columns: 1fr auto auto; /* desktop: input + 2 botones */
  gap:12px;
  align-items:stretch;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:14px;
  border:1px solid #e6e8ec;
  font-weight:600;
  line-height:1.2;
  text-decoration:none;
  cursor:pointer;
  white-space:nowrap;
}
.btn.primary{
  background:#101828;
  color:#fff;
  border-color:#101828;
}
.btn.ghost{
  background:#f4f6fa;
  color:#101828;
}

.ref-grid {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  align-items: stretch;

  width: 100%;
  box-sizing: border-box;
}

@media (max-width: 640px) {
  .ref-grid {
    grid-template-columns: 1fr;
  }
  .ref-grid .btn,
  .ref-grid > input {
    width: 100%;
  }
  .ref-grid {
    padding: 0 4px;   /* ajusta este valor según el padding de tus inputs */
  }
}
  </style>

  <meta name="color-scheme" content="light">

<body class="bg-[var(--bg)]">

<header id="slide" style="background:#ffffff; border-bottom:1px solid var(--border); padding:24px 16px;">

  <h1 class="text-2xl font-extrabold">Cotizador rápido</h1>
  <div>INGETES SAS</div>
</header>

  <div class="max-w-6xl mx-auto p-6">
    <div class="app-card mb-4">
      <div class="p-5 space-y-4">
<div class="field">
  <label>Inventario (.xls / .xlsx)</label>

</div>
<div class="field">
  <label for="ref">Referencia (MLFB)</label>
  <div class="ref-grid">
<input id="ref" type="text"
       placeholder="Ej. 6ES7131-6BH01-0BA0"
       style="text-transform:uppercase"
       autocapitalize="characters" />
    <a id="mallLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-soft">
      🔎 Industry Mall ↗
    </a>

  </div>
</div>
        <div>
          <label class="text-sm text-gray-700">Descripción del producto</label>
          <textarea id="desc" rows="4" class="w-full border rounded-lg px-3 py-2"
                    placeholder="Pega aquí la descripción completa"></textarea>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

          </div>
          <div class="rounded-xl border p-3">

          <button id="addBtn" class="btn-soft">➕ Agregar referencia</button> <!-- NUEVO -->
          <button id="copyBtn" class="btn-soft">📋 Copiar</button>

<script>
  
  // ⬅️ Ajusta esto si tu dominio es otro
  const API_BASE = 'https://portal-api-nine.vercel.app'; // tu backend en Vercel

  // Helpers
  let LOCK_PREVIEW = false; // si true, compute() no sobreescribe #preview
  let lastRefUsedForDesc = ""; // referencia para la que llenamos la descripción
  const $ = (id) => document.getElementById(id);
  const moneyCOP = (v) => (v == null || isNaN(v))
    ? "—"
    : v.toLocaleString("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });

  function cleanDesc(text) {
    if (!text) return "";
    let s = String(text);
    s = s.replace(/\r\n|\r|\n/g, "\n");
    s = s.replace(/\\+n/gi, "\n");
    s = s.replace(/&#10;|&#x0a;|%0a/gi, "\n");
    s = s.replace(/\\+t/gi, " ");
    s = s.split("\n").map(line => line.trim()).join("\n").replace(/ {2,}/g, " ").trim();
    return s;
  }

function scrollToSlide() {
  // intenta llevar el header al tope
  const target = document.getElementById('slide') || document.getElementById('ref');
  if (target && target.scrollIntoView) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    // fallback duro
    const root = document.scrollingElement || document.documentElement || document.body;
    root.scrollTop = 0;
  }
  // pone el cursor en la referencia (sin volver a scrollear)
  setTimeout(() => {
    const ref = document.getElementById('ref');
    if (ref) { try { ref.focus({ preventScroll: true }); } catch(_) { ref.focus(); } }
  }, 250);
}

  function normalizeAvailability(input) {
    const raw = (input || "").trim();
    if (!raw) return "(sin confirmar)";
    const n = (raw.match(/\d+/)?.[0]) ? parseInt(raw.match(/\d+/)[0], 10) : NaN;
    if (!Number.isFinite(n)) return raw;
    if (n >= 1 && n <= 6) return "3-5 días. (Salvo venta previa)";
    if (n >= 7 && n <= 20) return "10-20 días. (Salvo venta previa)";
    if (n >= 21 && n <= 45) return "30-45 días. (Salvo venta previa)";
    if (n >= 46 && n <= 60) return "6 - 8 semanas";
    if (n >= 61 && n <= 80) return "8 - 10 semanas";
    if (n >= 81 && n <= 90) return "10 - 12 semanas";
    return raw;
  }

// ===== INVENTARIO =====
let invMap = new Map();
async function ensureXLSX(){
  if(window.XLSX) return;
  const src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// normaliza referencias
const normRef = s => String(s||'')
  .replace(/\u00A0/g,' ')
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .replace(/[‐-‒–—−]/g,'-')
  .replace(/\s*-\s*/g,'-')
  .replace(/\s+/g,' ')
  .trim()
  .toUpperCase();

function parseQty(v){ 
  if (typeof v === 'number') return Math.round(v);
  const s = String(v ?? '').replace(/[^\d,.-]/g,'').replace(',','.');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n) : 0;
}

// ---- NUEVO: mostrar estado abajo/junto a Disponibilidad tras ingresar cantidad
function updateInvStatusUI() {
  const wrap   = document.getElementById('invStatusRow');
  const pill   = document.getElementById('invEstadoPill');
  const counts = document.getElementById('invCounts');

  const ref = normRef(document.getElementById('ref').value);
  const qty = parseInt(document.getElementById('qty').value || 0);

  // si no hay ref, cantidad o inventario, oculto
  if (!ref || !qty || !invMap || invMap.size === 0) {
    wrap.classList.add('hidden');
    return;
  }

  const data = invMap.get(ref);

  // estilos base
  const setPill = (text, bg, fg) => {
    pill.textContent = text;
    pill.style.background = bg;
    pill.style.color = fg;
  };

  if (!data) {
    setPill('NO EN INVENTARIO', '#fee2e2', '#7f1d1d'); // rojo suave
    counts.textContent = '';
    wrap.classList.remove('hidden');
    return;
  }

  const stock = data.cantidad;

  // 🔹 Si el inventario es 0, trátalo como NO EN INVENTARIO
  if (stock <= 0) {
    setPill('NO EN INVENTARIO', '#fee2e2', '#7f1d1d'); // rojo suave
    counts.textContent = '';
    wrap.classList.remove('hidden');
    return;
  }

  // 🔹 Si sí hay stock, ya miramos si alcanza o no
  if (stock >= qty) {
    setPill('EN INVENTARIO', '#dcfce7', '#065f46'); // verde
  } else {
    setPill('EN INVENTARIO (NO ALCANZA)', '#fef3c7', '#78350f'); // naranja
  }

  counts.textContent = `Solicitado: ${qty} • Inventario: ${stock}`;
  wrap.classList.remove('hidden');
}

// Enlazamos eventos para que aparezca DESPUÉS de poner cantidad
document.getElementById('qty').addEventListener('input', updateInvStatusUI);

// Si cambias referencia con cantidad cargada, también actualiza
document.getElementById('ref').addEventListener('change', () => {
  if (parseInt(document.getElementById('qty').value || 0) > 0) updateInvStatusUI();
});

// Si recargas inventario y ya hay ref+cantidad, refresca
document.getElementById('fileInv').addEventListener('change', () => {
  if (parseInt(document.getElementById('qty').value || 0) > 0) updateInvStatusUI();
});

// detectar columnas relevantes del inventario
function detectInvCols(ws){
  const range = XLSX.utils.decode_range(ws['!ref']);
  let colRef=null, colDesc=null, colQty=null;
  for(let r=range.s.r;r<=range.s.r+10;r++){
    for(let c=range.s.c;c<=range.e.c;c++){
      const val = String(ws[XLSX.utils.encode_cell({r,c})]?.v||'').toUpperCase();
      if(!val) continue;
      if(!colRef && (val.includes("REFERENCIA") || val.includes("MATERIAL"))) colRef=c;
      if(!colDesc && val.includes("DESCRIP")) colDesc=c;
      if(!colQty && (val.includes("CANTIDAD") || val.includes("QTY"))) colQty=c;
    }
  }
  if(colRef==null) colRef=range.s.c;
  if(colDesc==null) colDesc=colRef+1;
  if(colQty==null) colQty=colDesc+1;
  return { colRef, colDesc, colQty };
}

// parsea todo el inventario
function parseInventario(ws){
  const {colRef,colDesc,colQty}=detectInvCols(ws);
  const range = XLSX.utils.decode_range(ws['!ref']);
  const map = new Map();
  for(let r=range.s.r+1;r<=range.e.r;r++){
    const ref = normRef(ws[XLSX.utils.encode_cell({r,c:colRef})]?.v||"");
    if(!ref) continue;
    const desc = String(ws[XLSX.utils.encode_cell({r,c:colDesc})]?.v||"").trim();
    const qty = parseQty(ws[XLSX.utils.encode_cell({r,c:colQty})]?.v||0);
    if(!map.has(ref)) map.set(ref,{desc,cantidad:qty});
    else map.get(ref).cantidad += qty;
  }
  return map;
}

// === Evento: cargar inventario ===
document.getElementById("fileInv").addEventListener("change", async (ev)=>{
  const f = ev.target.files?.[0];
  if(!f) return;
  await ensureXLSX();
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf,{type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  invMap = parseInventario(ws);
  document.getElementById("invInfo").textContent =
    `Cargado: ${f.name} (${invMap.size} referencias)`;
});

  // === AUTOFILL: pedir descripción a tu API ===
  async function fetchMallDescription() {
    const ref = $("ref").value.trim().toUpperCase();
    if (!ref) {
      alert("Escribe una referencia (MLFB) primero.");
      return;
    }

    const btn = $("fetchMall");
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Buscando…';

    try {
      const url = `${API_BASE}/api/industry-mall?mlfb=${encodeURIComponent(ref)}`;
      const r = await fetch(url, { method: 'GET' });
      const j = await r.json().catch(() => ({}));

      btn.disabled = false;
      btn.textContent = oldText;

      if (!r.ok) {
        alert(`No se pudo consultar (${r.status}). Abre el Industry Mall y copia manualmente.`);
        return;
      }

      const desc = (j && j.description || '').trim();
      if (!desc) {
        $("desc").value = `Referencia: ${ref}. Ver ficha: ${j.source || 'N/A'}`;
        alert('No se encontró una descripción clara en el Mall. Usé un texto de apoyo.');
      } else {
        $("desc").value = cleanDesc(desc);
        lastRefUsedForDesc = ref; // esta descripción corresponde a esta referencia
      }
      compute();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = oldText;
      alert('Error consultando la API. Revisa la consola o el backend.');
      console.error(e);
    }
  }

  // Redondea hacia arriba al múltiplo indicado (100 por defecto)
function roundUpTo(v, step = 100) {
  if (v == null || isNaN(v)) return null;
  return Math.ceil(v / step) * step;
}

  // Cálculos y previsualización
  function compute() {
const ref = $("ref").value.trim().toUpperCase();
const qty = Math.max(1, parseInt(($("qty").value || 1), 10));
const url = ref
  ? `https://mall.industry.siemens.com/mall/es/ww/Catalog/Product/?mlfb=${encodeURIComponent(ref)}`
  : "https://mall.industry.siemens.com/goos/WelcomePage.aspx?language=es&regionUrl=/co";

$("mallLink").href = url;          // <- solo actualiza el href

    const desc = cleanDesc($("desc").value);
    const priceMode = $("priceMode").value;
    const price = Number($("price").value || 0);
    const trm = Number($("trm").value || 0);
    const discount = Number($("discount").value || 0);
    const util = Number($("util").value || 1);
    const shipping = Number($("shipping").value || 0);
    const lead = $("lead").value;
    const notes = $("notes").value.trim();

const baseCOP   = priceMode === "USD" ? (price * trm) : price;
const afterDisc = baseCOP ? baseCOP * (1 - discount / 100) : null;
const saleAfter = afterDisc != null ? afterDisc * (util || 1) : null;

// 👉 redondeos del precio neto (sin envío)
const roundedUnit = (saleAfter != null) ? roundUpTo(saleAfter, 100) : null;

// 👉 reparto del envío entre las unidades
//    - si qty=2 y shipping=20.000 => 10.000 por unidad
//    - cada parte se redondea a 100 para mantener coherencia
const sPerUnitRaw      = (qty > 0) ? (shipping || 0) / qty : 0;
const sPerUnitRounded  = roundUpTo(sPerUnitRaw, 100);

// 👉 precio unitario FINAL (incluye su porción de envío)
const roundedUnitWithShip = (roundedUnit != null)
  ? (roundedUnit + sPerUnitRounded)
  : null;

// 👉 total antes de IVA = unitario final * cantidad
const roundedTotal = (roundedUnitWithShip != null)
  ? (roundedUnitWithShip * qty)
  : null;

// tarjetas (muestran valores ya redondeados)
$("baseCop").textContent     = moneyCOP(baseCOP || null);
$("saleAfter").textContent   = moneyCOP(roundedUnitWithShip != null ? roundedUnitWithShip : null);
$("shipVal").textContent     = moneyCOP(shipping || null);
$("totalBefore").textContent = moneyCOP(roundedTotal != null ? roundedTotal : null);
    
const availability = normalizeAvailability(lead);
const notesPart = notes ? `\n\nNOTAS: ${notes}` : "";

let block = "(Completa referencia, descripción y valores para ver el bloque final)";
if (ref && desc && roundedTotal != null) {
  if (qty === 1) {
    // Solo costo total
block = `${ref}
${desc}
Costo total: ${moneyCOP(roundedTotal)} + IVA
Disponibilidad: ${availability}${notesPart}`;
  } else {
  // Cantidad + unitario redondeado (CON envío prorrateado) + total
block = `${ref}
${desc}
Cantidad: ${qty}
Precio unitario: ${moneyCOP(roundedUnitWithShip)}
Costo total: ${moneyCOP(roundedTotal)} + IVA
Disponibilidad: ${availability}${notesPart}`;
  }
}

if (!LOCK_PREVIEW) {
  $("preview").textContent = block;
}
return block.includes("Completa referencia") ? "" : block;
}

async function copyBlock() {
  const prev = $("preview");
  if (!prev) return;
  const txt = (prev.textContent || "").trim();
  if (!txt || txt.includes("Completa referencia")) return;

  const msg = $("copyMsg"); // puede ser null
  const setMsg = (t, cls) => {
    if (!msg) return;
    msg.textContent = t;
    msg.className = "text-sm ml-auto " + (cls || "");
  };
  setMsg("", "");

  // 1) Intento moderno (HTTPS / localhost)
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(txt);
      setMsg("✅ Copiado al portapapeles", "text-emerald-600");
      return;
    }
    throw new Error("Clipboard API no disponible");
  } catch {
    // 2) Fallback legacy: textarea oculto + execCommand('copy')
    try {
      const ta = document.createElement("textarea");
      ta.value = txt;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) {
        setMsg("✅ Copiado", "text-emerald-600");
      } else {
        setMsg("⚠️ Copia manual: selecciona y Ctrl/Cmd+C", "text-amber-600");
      }
    } catch {
      setMsg("⚠️ Copia manual: selecciona y Ctrl/Cmd+C", "text-amber-600");
    }
  }
}

function downloadTxt() {
  const txt = $("preview").textContent.trim();
  if (!txt || txt.includes("Completa referencia")) return;

  // usa la 1ª línea del preview como parte del nombre si existe
  const first = txt.split(/\r?\n/)[0] || "cotizacion";
  const safe = first.replace(/[^A-Za-z0-9_-]+/g, "-").slice(0, 60);
  const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `cotizacion-${safe}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetAll() {
  $("ref").value = "";
  $("desc").value = "";
  $("priceMode").value = "COP";
  $("price").value = "";

  // Eventos

  // Fuerza mayúsculas en #ref (typing y pegar) sin perder la posición del cursor
(function forceRefUpper() {
  const el = $("ref");
  if (!el) return;
  const toUpper = (e) => {
    const i = e.target;
    const s = i.selectionStart, t = i.selectionEnd;
    const up = i.value.toUpperCase();
    if (i.value !== up) {
      i.value = up;
      if (s != null && t != null) i.setSelectionRange(s, t);
    }
  };
  el.addEventListener("input", toUpper);
  el.addEventListener("change", toUpper);
})();
  
  ["ref","desc","priceMode","price","trm","discount","util","shipping","qty","lead","notes"].forEach(id => {
    $(id).addEventListener("input", compute);
    $(id).addEventListener("change", compute);
  });
  $("copyBtn").addEventListener("click", copyBlock);
  $("resetBtn").addEventListener("click", resetAll);
  $("addBtn").addEventListener("click", () => {
  const txt = compute();
  if (!txt) return;

  const prev = $("preview").textContent.trim();

  if (!LOCK_PREVIEW && prev === txt) {
    LOCK_PREVIEW = true;
    scrollToSlide();      // 👈 sube primero
    clearInputsForNext(); // limpia SIN hacer focus
    return;
  }

  $("preview").textContent = prev ? `${prev}\n\n${txt}` : txt;
  LOCK_PREVIEW = true;
  scrollToSlide();        // 👈 sube primero
  clearInputsForNext();   // limpia SIN hacer focus
});

  compute();
</script>
