<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cotizador de Importación — INGETES</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#fff; --border:#e5e7eb; --muted:#6b7280; --text:#0b1020;
    --input-bg:#fff; --input-border:#d1d5db; --btn:#111827; --btn-text:#fff; --table-head:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:20px 16px;border-bottom:1px solid var(--border);background:#fff}
  h1{margin:0;font-size:22px;font-weight:800}
  main{max-width:1100px;margin:0 auto;padding:20px 16px}
  .grid{display:grid;gap:14px}
  .two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .field{display:flex;flex-direction:column}

/* pantallas medianas: 2 columnas */
@media (max-width: 1024px){
  .four { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .three { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .two { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

/* pantallas pequeñas: 1 columna */
@media (max-width: 640px){
  .four, .three, .two { grid-template-columns: 1fr; }
}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px}
  .pad{padding:16px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{
    width:100%;padding:10px 12px;background:var(--input-bg);color:var(--text);
    border:1px solid var(--input-border);border-radius:10px;outline:none
  }
  input:focus,select:focus{border-color:#9aa7b4;box-shadow:0 0 0 3px rgba(2,132,199,.15)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);
       background:#f3f4f6;color:var(--text);cursor:pointer;font-weight:600}
  .btn.primary{background:var(--btn);color:var(--btn-text)}
  .btn:hover{filter:brightness(1.03)}
  table{width:100%;border-collapse:collapse;background:#fff}
  th,td{border:1px solid var(--border);padding:6px 8px;font-size:12px}
  th{background:var(--table-head);font-weight:700}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .right{text-align:right}
  .center{text-align:center}
  .input-error{border-color:#dc2626 !important; box-shadow:0 0 0 2px rgba(220,38,38,.20) !important;}
  /* asterisco rojo en etiquetas obligatorias */
label.req::after{ content:" *"; color:#dc2626; margin-left:4px }
/* cuando hay error, también poner la etiqueta en rojo */
label.label-error{ color:#dc2626 }

</style>
</head>
<body>
<header>
  <h1>Cotizador de importación</h1>
  <div>INGETES S.A.S — Bogotá, Colombia</div>
</header>

<main class="grid">
  <!-- 1) Datos de la cotización -->
  <section class="card pad">
    <h3>1) Datos de la cotización</h3>
<div class="grid four">
  <!-- Fila 1 -->
  <div class="field">
    <label class="req">Número de cotización</label>
    <input id="numCot" placeholder="###" inputmode="numeric" pattern="[0-9]*">
  </div>
  <div class="field">
    <label class="req">Iniciales comercial</label>
    <input id="iniCom" maxlength="3" placeholder="AAA" style="text-transform:uppercase">
  </div>
  <div class="field">
    <label class="req">Cliente</label>
    <input id="cliente" placeholder="EMPRESA S.A." style="text-transform:uppercase">
  </div>
  <div class="field">
    <label class="req">Fecha de elaboración</label>
    <input id="fechaElab" type="date">
  </div>

  <!-- Fila 2 -->
  <div class="field">
    <label class="req">Año (YY)</label>
    <input id="anio" type="number" min="0" max="99" placeholder="##">
  </div>
  <div class="field">
    <label>Versión (A,B,…)</label>
    <input id="sufijo" maxlength="1" placeholder="A" style="text-transform:uppercase">
  </div>
  <div class="field" style="grid-column: 3 / span 2">
    <label>Nombre de salida</label>
    <input id="outName" readonly>
  </div>
</div>
  </section>

  <!-- 2) Ítems (manual) -->
  <section class="card pad">
<h3>2) Ítems de la oferta</h3>

<!-- Fila 1: Moneda + FACT + TRM (3 columnas) -->
<div class="grid three" style="margin-bottom:10px">
  <div class="field">
    <label class="req">Moneda</label>
    <select id="moneda">
      <option value="USA">USD</option>
      <option value="EUR" selected>EUR</option>
    </select>
  </div>

  <!-- Bloque USA (oculto por defecto) -->
  <div id="blkUSA" class="field" style="display:none">
    <label class="req">FACT. IMPORT. USA</label>
    <input id="factUSA" type="number" step="0.01" value="1.35">
  </div>
  <div id="blkUSA_trm" class="field" style="display:none">
    <label class="req">TRM USA</label>
    <input id="trmUSA" type="number" step="1" value="4200">
  </div>

  <!-- Bloque EUR -->
  <div id="blkEUR" class="field">
    <label class="req">FACT. IMPORT. EUR</label>
    <input id="factEUR" type="number" step="0.01" value="1.35">
  </div>
  <div id="blkEUR_trm" class="field">
    <label class="req">TRM EUR</label>
    <input id="trmEUR" type="number" step="1" value="4800">
  </div>
</div>

<!-- Fila 2–4: 3 columnas; Descripción ocupa 2 columnas -->
<div class="grid three" style="gap:10px">

  <!-- Referencia -->
  <div>
    <label class="req">Referencia</label>
    <input id="ref" class="mono" placeholder="Referencia">
  </div>

  <!-- Descripción (span 2) -->
  <div style="grid-column: span 2;">
    <label class="req">Descripción</label>
    <input id="desc" placeholder="Descripción del producto">
  </div>

  <!-- Mostrar referencia en descripción (VENTA) -->
  <div>
    <label>Mostrar referencia en descripción (VENTA)</label>
    <select id="mostrarRef">
      <option value="NO">NO</option>
      <option value="SI">SI</option>
    </select>
  </div>

  <!-- Cantidad -->
  <div>
    <label class="req">Cantidad</label>
    <input id="cant" type="number" min="1" placeholder="1">
  </div>

  <!-- Precio lista -->
  <div>
    <label class="req">Precio lista (COP)</label>
    <input id="precio" type="number" min="0" step="1" placeholder="0">
  </div>

  <!-- Descuento % -->
  <div>
    <label class="req">Descuento %</label>
    <input id="dcto" type="number" min="0" max="100" step="0.01" placeholder="0">
  </div>

  <!-- Disponibilidad (días) -->
  <div>
    <label class="req">Disponibilidad (días)</label>
    <input id="disponibilidad" placeholder="Inmediata / 2 sem / 4 sem">
  </div>

  <!-- Factor de utilidad (global) -->
  <div>
    <label class="req">Factor de utilidad (global)</label>
    <input id="factorGlobal" type="number" step="0.01" min="1.00" placeholder="1.25">
  </div>

  <!-- Envío por ítem (global, COP) -->
  <div>
    <label>Envío por ítem (global, COP)</label>
    <input id="envioGlobal" type="number" step="1" placeholder="0">
  </div>

<!-- Descuento total de la oferta (%) -->
<div>
  <label>Descuento total oferta (%)</label>
  <input id="descOferta" type="number" min="0" max="4" step="0.01" placeholder="0" />
</div>

  <!-- Existencia -->
  <div>
    <label class="req">Existencia</label>
    <input list="existOptions" id="existencia" placeholder="Selecciona o escribe">
    <datalist id="existOptions">
      <option value="DINI ARGEO"></option>
      <option value="RICE LAKE"></option>
      <option value="ECOM"></option>
    </datalist>
  </div>

  <!-- Botón -->
  <div style="grid-column:1 / span 3;">
    <button id="add" class="btn">Añadir referencia</button>
  </div>
</div>

    <!-- Vista previa local -->
    <div style="margin-top:12px;max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:12px">
      <table id="tbl">
        <thead>
          <tr>
            <th>#</th><th>Referencia</th><th>Descripción</th><th class="right">Cant</th>
            <th class="right">Precio lista</th><th class="right">% Desc.</th>
            <th class="right">V/Unit</th><th class="right">V/Total</th><th>Acción</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr>
            <th colspan="7" class="right">TOTAL</th>
            <th id="grand" class="right">$ 0</th>
            <th></th>
          </tr>
        </tfoot>
      </table>
    </div>
  </section>

  <!-- 3) Generar -->
  <section class="card pad">
    <h3>3) Generar Excel</h3>
    <div class="row">
      <button id="gen" class="btn primary">Generar y descargar</button>
      <button id="reset" class="btn">Reiniciar</button>
      <span id="log" style="color:#6b7280"></span>
    </div>
  </section>
</main>

<!-- Librería ExcelJS -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js" defer crossorigin="anonymous"></script>

<script>
(function(){
  const $ = s=>document.querySelector(s);
  const fmtMoney = v => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(v||0);
  const items = [];  // {ref, desc, cant, precio, dcto}

// ===== VALIDACIÓN DE CAMPOS OBLIGATORIOS =====
const REQ_IDS = [
  '#numCot', '#iniCom', '#cliente', '#fechaElab', '#anio',
  '#moneda', // select
  // moneda -> según USD/EUR cambia el par de factor/TRM obligatorio:
  // '#factUSA','#trmUSA'  o  '#factEUR','#trmEUR'
  '#ref', '#desc', '#cant', '#precio', '#dcto',
  '#disponibilidad', '#factorGlobal', '#existencia'
];

function mark(el, bad){
  el.classList.toggle('input-error', !!bad);
  const lab = el?.parentElement?.querySelector('label');
  if (lab) lab.classList.toggle('label-error', !!bad);
  return !bad;
}


function getActiveFactTrm(){
  return (document.querySelector('#moneda').value === 'USA')
    ? ['#factUSA','#trmUSA']
    : ['#factEUR','#trmEUR'];
}

// quita el rojo a medida que se escribe/cambia
function attachLiveCleanup(){
  const ids = new Set([...REQ_IDS, ...getActiveFactTrm()]);
  ids.forEach(sel=>{
    const el = document.querySelector(sel);
    if(!el) return;
    const evt = (el.tagName === 'SELECT') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      el.classList.remove('input-error');
      const lab = el.parentElement?.querySelector('label');
      if (lab) lab.classList.remove('label-error');
    });
  });
}

attachLiveCleanup();

function validateHeaderRequired(){
  let ok = true;
  // básicos
  ['#numCot','#iniCom','#cliente','#fechaElab','#anio','#moneda'].forEach(sel=>{
    const el = document.querySelector(sel);
    ok &= mark(el, !(el && String(el.value).trim().length));
  });

  // factor / TRM según moneda
  getActiveFactTrm().forEach(sel=>{
    const el = document.querySelector(sel);
    ok &= mark(el, !(el && String(el.value).trim().length));
  });

  return !!ok;
}

// Valida los campos del ítem ANTES de añadirlo
function validateItemFields(){
  let ok = true;
  const ref = document.querySelector('#ref');
  const desc= document.querySelector('#desc');
  const cant= document.querySelector('#cant');
  const precio=document.querySelector('#precio');
  const dcto  =document.querySelector('#dcto');
  const disp  =document.querySelector('#disponibilidad');
  const fact  =document.querySelector('#factorGlobal');
  const exist =document.querySelector('#existencia');

  ok &= mark(ref,   !ref.value.trim());
  ok &= mark(desc,  !desc.value.trim());
  ok &= mark(cant, !(Number(cant.value) > 0));
  ok &= mark(precio, String(precio.value).trim()===''); // permite 0 si quisieras
  ok &= mark(dcto,   String(dcto.value).trim()==='');  // “0” es válido pero obligatorio
  ok &= mark(disp,   !disp.value.trim());
  ok &= mark(fact,   String(fact.value).trim()==='');
  ok &= mark(exist,  !exist.value.trim());

  return !!ok;
}

// helper: si hay error, enfoca y hace scroll
function focusFirstError(){
  const err = document.querySelector('.input-error');
  if(err){ err.focus({preventScroll:false}); err.scrollIntoView({behavior:'smooth',block:'center'}); }
}

// Toggle USA / EUR en UI + set de valores por defecto
function toggleMonedaUI(){
  const m = $('#moneda').value;
  const usa = (m === 'USA');

  // mostrar/ocultar ambos bloques (factor y TRM)
  $('#blkUSA').style.display      = usa ? 'flex' : 'none';
  $('#blkUSA_trm').style.display  = usa ? 'flex' : 'none';
  $('#blkEUR').style.display      = usa ? 'none' : 'flex';
  $('#blkEUR_trm').style.display  = usa ? 'none' : 'flex';

  // poner predeterminados al cambiar (editables por el usuario)
  if (usa) {
    $('#factUSA').value = 1.35;
    $('#trmUSA').value  = 4200;
  } else {
    $('#factEUR').value = 1.35;
    $('#trmEUR').value  = 4800;
  }
// limpiar rojo si estaban marcados
getActiveFactTrm().forEach(sel=>{
  const el = document.querySelector(sel);
  el && el.classList.remove('input-error');
});
}

$('#moneda')?.addEventListener('change', toggleMonedaUI);
toggleMonedaUI();

  function updateOut(){
    const n = ($('#numCot').value||'').trim() || '#';
    const i = ($('#iniCom').value||'').toUpperCase();
    const yIn = ($('#anio').value||'').trim();
    const y = yIn ? yIn.padStart(2,'0') : '##';
    const s = ($('#sufijo').value||'').toUpperCase();
    $('#outName').value = (`Q${n}-${i||'AAA'}-${y}${s}`).toUpperCase();
  }
  ['numCot','iniCom','anio','sufijo'].forEach(id=>$('#'+id).addEventListener('input',updateOut));
  updateOut();

  function calcUnit(it){
    const d = Math.min(100, Math.max(0, Number(it.dcto)||0))/100;
    const factor = Number($('#factorGlobal').value||1.25);
    const envio  = Number($('#envioGlobal').value||0);
    const costo  = (Number(it.precio)||0) * (1 - d);
    return Math.max(0, (costo * factor) + envio);
  }

  function repaint(){
    const tb = $('#tbody'); tb.innerHTML = '';
    let total = 0;
    items.forEach((it,idx)=>{
      const vUnit = calcUnit(it);
      const vTot  = vUnit * (Number(it.cant)||0);
      total += vTot;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="center">${idx+1}</td>
        <td class="mono">${it.ref||''}</td>
        <td>${it.desc||''}</td>
        <td class="right">${Number(it.cant)||0}</td>
        <td class="right">${fmtMoney(it.precio||0)}</td>
        <td class="right">${Number(it.dcto||0).toFixed(2)}%</td>
        <td class="right">${fmtMoney(vUnit)}</td>
        <td class="right">${fmtMoney(vTot)}</td>
        <td class="center"><button class="btn" data-del="${idx}">Quitar</button></td>
      `;
      tb.appendChild(tr);
    });
    $('#grand').textContent = fmtMoney(total);

    tb.querySelectorAll('button[data-del]').forEach(b=>{
      b.addEventListener('click',()=>{
        const i = Number(b.dataset.del);
        items.splice(i,1);
        repaint();
      });
    });
  }

function mapDisponibilidad(n){
  n = Number(n) || 0;
  if (n >= 1 && n <= 6)  return "3-5 días. (Salvo venta previa)";
  if (n >= 7 && n <= 45) return "30-45 días. (Salvo venta previa)";
  if (n >= 46 && n <= 60) return "6 - 8 semanas";
  if (n >= 61 && n <= 80) return "8 - 10 semanas";
  if (n >= 81 && n <= 90) return "10 - 12 semanas";
  return "";
}

// añadir ítem (con validación de obligatorios del ítem)
$('#add').addEventListener('click', ()=>{
  // valida encabezado mínimo para que el usuario lo haga en orden
  if(!validateHeaderRequired()){ focusFirstError(); return; }

  if(!validateItemFields()){ focusFirstError(); return; }

  const ref = $('#ref').value.trim().toUpperCase();
  const desc= $('#desc').value.trim();
  const cant= Math.max(1, Number($('#cant').value||1));
  const precio = Math.max(0, Number($('#precio').value||0));
  const dcto = Math.max(0, Math.min(100, Number($('#dcto').value||0)));
  const existencia = $('#existencia').value.trim();

  // Disponibilidad: mapeo/uso como ya lo tenías
  let dispInput = $('#disponibilidad').value.trim();
  let disponibilidad;
  if (dispInput === "") {
    disponibilidad = mapDisponibilidad($('#cant').value);
  } else if (/^\d+$/.test(dispInput)) {
    disponibilidad = mapDisponibilidad(dispInput);
  } else {
    disponibilidad = dispInput;
  }

  items.push({ref, desc, cant, precio, dcto, existencia, disponibilidad});

['ref','desc','precio','existencia','disponibilidad','cant','dcto'].forEach(id=>$('#'+id).value='');
  repaint();
});

// reset TOTAL (datos de cotización + ítems + tabla + errores)
$('#reset').addEventListener('click', ()=>{
  items.length = 0;
  repaint();
  ['cliente','fechaElab','numCot','iniCom','anio','sufijo','outName'].forEach(id => $('#'+id).value = '');
  $('#moneda').value = 'EUR';
  toggleMonedaUI();
  [
    'ref','desc','cant','precio','dcto','disponibilidad',
    'factorGlobal','envioGlobal','existencia',
    'factUSA','trmUSA','factEUR','trmEUR','descOferta'
  ].forEach(id => { const el = $('#'+id); if (el) el.value = ''; });
  document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
  document.querySelectorAll('label.label-error').forEach(lab => lab.classList.remove('label-error'));
  updateOut();
});

  // ======= FUNCIÓN COMPLETA DE GENERACIÓN DE EXCEL (con B6 y B7) =======
  $('#gen').addEventListener('click', async ()=>{
// Validación global antes de generar
if(!validateHeaderRequired()){
  alert('Completa los campos obligatorios resaltados.');
  focusFirstError();
  return;
}
if(!items.length){
  alert('Primero añade al menos 1 ítem con todos los campos obligatorios.');
  return;
}

    if(!items.length){ alert('Primero añade al menos 1 ítem.'); return; }

    const ExcelJS = window.ExcelJS;
    if(!ExcelJS){ alert('No se pudo cargar ExcelJS'); return; }

    const wb = new ExcelJS.Workbook();

    // --- LOCATIVO ---
    const ws = wb.addWorksheet('LOCATIVO');
    const thin={style:'thin',color:{argb:'FF000000'}}, box={top:thin,left:thin,bottom:thin,right:thin}, center={vertical:'middle',horizontal:'center'};
    // A..L  =>  B..L son visibles
ws.columns=[
  {width:2.5},  // A
  {width:6},    // B = ITEM
  {width:14},   // C = REFERENCIA (antes 9)
  {width:6},   // D = CANT
  {width:46},   // E = DESCRIPCION
  {width:14},   // F = PRECIO LISTA
  {width:14},   // G = % DESC.
  {width:14},   // H = EXISTENCIA
  {width:18},   // I = V/COSTO (antes 14)
  {width:18},   // J = FACT. UTILIDAD
  {width:18},   // K = V/UNIT VENTA (antes 16)
  {width:18}    // L = V/TOTAL
];

    // Encabezado general (incluye O.C ANTERIOR y O.C ACTUAL)
    ws.mergeCells('B2:L2'); ws.getCell('B2').value='TABLA DE COSTOS'; ws.getCell('B2').font={bold:true,size:14}; ws.getCell('B2').alignment=center;

    ws.mergeCells('B3:G3'); ws.getCell('B3').value = `NUMERO DE COTIZACIÓN: ${($('#outName').value||'')}`;
    ws.getCell('B3').border = box; ws.getCell('B3').alignment = {horizontal:'left',vertical:'middle'};

    ws.mergeCells('B4:G4'); ws.getCell('B4').value = `CLIENTE: ${($('#cliente').value||'').toUpperCase()}`;
    ws.getCell('B4').border = box; ws.getCell('B4').alignment = {horizontal:'left',vertical:'middle'};

    ws.mergeCells('B5:G5'); ws.getCell('B5').value = `FECHA DE ELABORACIÓN COTIZACIÓN: ${$('#fechaElab').value||''}`;
    ws.getCell('B5').border = box; ws.getCell('B5').alignment = {horizontal:'left',vertical:'middle'};

    // >>> Las dos líneas que pediste:
    ws.mergeCells('B6:G6'); ws.getCell('B6').value = 'O.C ANTERIOR DEL CLIENTE:                                                                                          FECHA:';
    ws.getCell('B6').border = box; ws.getCell('B6').alignment = {horizontal:'left',vertical:'middle'};

    ws.mergeCells('B7:G7'); ws.getCell('B7').value = 'O.C ACTUAL DEL CLIENTE:                                                                                              FECHA:';
    ws.getCell('B7').border = box; ws.getCell('B7').alignment = {horizontal:'left',vertical:'middle'};

// === FACTORES (col I-L, filas 4-6) ===
ws.mergeCells('I4:L4');
ws.getCell('I4').value = 'FACTORES';
ws.getCell('I4').font = {bold:true};
ws.getCell('I4').alignment = {horizontal:'center',vertical:'middle'};
ws.getCell('I4').border = box;

// Fila 5: FACT. IMPORT. USA | FACT. IMPORT. EUR
ws.getCell('I5').value = 'FACT. IMPORT. USA';
ws.getCell('J5').value = Number($('#factUSA').value||1.35);
ws.getCell('K5').value = 'FACT. IMPORT. EUR';
ws.getCell('L5').value = Number($('#factEUR').value||1.35);

// Fila 6: TRM USA | TRM EUR
ws.getCell('I6').value = 'TRM USA';
ws.getCell('J6').value = Number($('#trmUSA').value||4200);
ws.getCell('K6').value = 'TRM EUR';
ws.getCell('L6').value = Number($('#trmEUR').value||4800);

// Bordes
['I5','J5','K5','L5','I6','J6','K6','L6'].forEach(a=>{ ws.getCell(a).border = box; });

// Pinta según moneda
const monedaSel = ($('#moneda')?.value || 'USA');
if(monedaSel === 'USA'){
  // Solo 2 bloques: FACT. IMPORT. USA y TRM USA
  ws.getCell('I5').value = 'FACT. IMPORT. USA';
  ws.getCell('J5').value = Number($('#factUSA').value||1.35);

  ws.getCell('I6').value = 'TRM USA';
  ws.getCell('J6').value = Number($('#trmUSA').value||4200);

  // (K/L quedan en blanco)
}else{
  // Solo 2 bloques: FACT. IMPORT. EUR y TRM EUR
  ws.getCell('K5').value = 'FACT. IMPORT. EUR';
  ws.getCell('L5').value = Number($('#factEUR').value||1.35);

  ws.getCell('K6').value = 'TRM EUR';
  ws.getCell('L6').value = Number($('#trmEUR').value||4800);

  // (I/J quedan en blanco)
}

    // Encabezados (orden solicitado)
    const startRow=9, startCol=2; // B9
    const HDR=['ITEM','REFERENCIA','CANT','DESCRIPCION','PRECIO LISTA','% DESC.','EXISTENCIA','V/COSTO','FACT. UTILIDAD','V/UNIT VENTA','V/TOTAL'];
    for(let i=0;i<HDR.length;i++){
      const c=ws.getCell(startRow,startCol+i);
      c.value=HDR[i]; c.font={bold:true};
      c.alignment={vertical:'middle',horizontal:'center',wrapText:true};
      c.border=box;
    }
    let r=startRow+1; const dataStart=r;

    const factorGlobal = Number($('#factorGlobal').value||1.25);

    items.forEach((it,idx)=>{
      const c=(i)=>ws.getCell(r,startCol+i);
      const cant = Number(it.cant)||0;
      const dPct = Math.min(100, Math.max(0, Number(it.dcto)||0))/100;

      c(0).value = idx+1;                 // ITEM
      c(1).value = it.ref;                // REFERENCIA
      c(2).value = cant;                  // CANT
      c(3).value = it.desc;               // DESCRIPCION
// Forzar wrap solo en DESCRIPCION de cada fila
ws.getCell(r, startCol+3).alignment = { ...(ws.getCell(r, startCol+3).alignment||{}), wrapText:true };
      c(4).value = Number(it.precio)||0;  // PRECIO LISTA
      c(5).value = dPct;                  // % DESC. (decimal)
      c(6).value = it.existencia || '';   // EXISTENCIA (manual)   // DISPONIBILIDAD (helper oculto)
      const monedaSel = ($('#moneda')?.value || 'USA');
      // Si USA: TRM y FACT están en J6 y J5. Si EUR: en L6 y L5.
      const cellTRM  = (monedaSel === 'USA') ? '$J$6' : '$L$6';
      const cellFACT = (monedaSel === 'USA') ? '$J$5' : '$L$5';

      // V/COSTO = PRODUCTO(PRECIO_LISTA * (1 - %DESC), TRM, FACT. IMPORT.)
c(7).value = { formula:`PRODUCT(F${r}*(1 - G${r}), ${cellTRM}, ${cellFACT})` };
c(8).value = factorGlobal;                  // FACT. UTILIDAD
c(9).value = { formula:`ROUNDUP(I${r}*J${r}, -2)` };
c(10).value = { formula:`K${r}*D${r}` };

c(4).numFmt='"$" #,##0';
c(5).numFmt='0%';
c(7).numFmt='"$" #,##0';
c(9).numFmt='"$" #,##0';
c(10).numFmt='"$" #,##0';

// Alineación y bordes
for(let i=0;i<HDR.length;i++){
  ws.getCell(r,startCol+i).border=box;
  if(i>=4) ws.getCell(r,startCol+i).alignment={horizontal:'right',vertical:'middle'}; // alinear derecha desde "Precio lista"
}
ws.getCell(r,startCol+0).alignment=center;
ws.getCell(r,startCol+2).alignment=center;
ws.getCell(r,startCol+5).alignment=center;
ws.getCell(r,startCol+1).alignment=center; // REFERENCIA centrada

      r++;
    });

// ===== Pie completo estilo "excel-inv" =====
const foot = r + 1;

// 1) IVA NO INCLUIDO (B..J) y TOTAL (K..L)
ws.mergeCells(foot, startCol, foot, startCol + 8);            // B..J
ws.getCell(foot, startCol).value     = 'I.V.A NO INCLUIDO';
ws.getCell(foot, startCol).border    = box;
ws.getCell(foot, startCol).alignment = { horizontal:'center', vertical:'middle' };

ws.getCell(foot, startCol + 9).value     = 'TOTAL:';          // K
ws.getCell(foot, startCol + 9).font      = { bold:true };
ws.getCell(foot, startCol + 9).border    = box;
ws.getCell(foot, startCol + 9).alignment = { horizontal:'right', vertical:'middle' };

ws.getCell(foot, startCol + 10).value  = { formula:`SUM(L${dataStart}:L${r-1})` }; // L
ws.getCell(foot, startCol + 10).numFmt = '"$" #,##0';
ws.getCell(foot, startCol + 10).border = box;
ws.getCell(foot, startCol + 10).alignment = { horizontal:'right', vertical:'middle' };

// 2) FILA DE FIRMAS (dos filas más abajo para respirar)
const fr = foot + 2;

// FIRMA DE COMERCIAL: B..F
ws.mergeCells(fr, startCol, fr, startCol + 4);                 // B..F
ws.getCell(fr, startCol).value     = 'FIRMA DE COMERCIAL:';
ws.getCell(fr, startCol).border    = box;
ws.getCell(fr, startCol).alignment = { horizontal:'left', vertical:'middle' };

// FIRMA DE COMPRAS: H..L
ws.mergeCells(fr, startCol + 6, fr, startCol + 10);            // H..L
ws.getCell(fr, startCol + 6).value     = 'FIRMA DE COMPRAS:';
ws.getCell(fr, startCol + 6).border    = box;
ws.getCell(fr, startCol + 6).alignment = { horizontal:'left', vertical:'middle' };

// 3) SOLICITUD DE DESCUENTO (dos filas debajo de la fila de firmas)
const frDesc = fr + 2;

// Etiqueta: B..D
ws.mergeCells(frDesc, startCol, frDesc, startCol + 2);         // B..D
ws.getCell(frDesc, startCol).value     = 'SOLICITUD DE DESCUENTO:';
ws.getCell(frDesc, startCol).border    = box;
ws.getCell(frDesc, startCol).alignment = { horizontal:'left', vertical:'middle' };

// Detalle con dos líneas: E..F
ws.mergeCells(frDesc, startCol + 3, frDesc, startCol + 4);     // E..F
ws.getCell(frDesc, startCol + 3).value =
  'Descuento otorgado: __________%\nMotivo: ___________________________';
ws.getCell(frDesc, startCol + 3).border = box;
ws.getCell(frDesc, startCol + 3).alignment =
  { horizontal:'left', vertical:'top', wrapText:true };

// 4) Bloque ENVÍO a la derecha (H..K)
const colH = startCol + 6; // H
const colI = startCol + 7; // I
const colJ = startCol + 8; // J
const colK = startCol + 9; // K

// Etiquetas
ws.getCell(frDesc, colH).value     = 'ENVÍO POR ÍTEM:';
ws.getCell(frDesc, colH).border    = box;
ws.getCell(frDesc, colH).alignment = { horizontal:'left', vertical:'middle' };

ws.getCell(frDesc, colJ).value     = 'TOTAL ENVÍO:';
ws.getCell(frDesc, colJ).border    = box;
ws.getCell(frDesc, colJ).alignment = { horizontal:'left', vertical:'middle' };

// Valor de "Envío por ítem" (desde el formulario)
const envioGlobal = Number(document.getElementById('envioGlobal').value || 0);
ws.getCell(frDesc, colI).value  = envioGlobal;                 // I
ws.getCell(frDesc, colI).numFmt = '"$" #,##0';
ws.getCell(frDesc, colI).border = box;
ws.getCell(frDesc, colI).alignment = { horizontal:'right', vertical:'middle' };

// Total envío = envío por ítem * SUMA de cantidades (columna D de LOCATIVO)
const firstItemRow = dataStart;     // primera fila de ítems
const lastItemRow  = r - 1;         // última fila de ítems
ws.getCell(frDesc, colK).value  = { formula: `I${frDesc}*SUM(D${firstItemRow}:D${lastItemRow})` };
ws.getCell(frDesc, colK).numFmt = '"$" #,##0';
ws.getCell(frDesc, colK).border = box;
ws.getCell(frDesc, colK).alignment = { horizontal:'right', vertical:'middle' };

// Altura para ver bien las dos líneas del detalle
ws.getRow(frDesc).height = 45.8;

// (Opcional) fuerza wrap en todo el rango usado del LOCATIVO
for(let R=2; R<=Math.max(frDesc, ws.lastRow.number); R++){
  for(let C=2; C<=12; C++){
    const cell = ws.getCell(R, C);
    cell.alignment = { ...(cell.alignment||{}), wrapText:true };
  }
}

// === Configuración de impresión (LOCATIVO) ===
const lastRowLoc = Math.max(frDesc, ws.lastRow.number);

ws.pageSetup = {
  fitToPage: true,
  fitToWidth: 1,
  fitToHeight: 1,
  orientation: 'landscape',        // horizontal
  horizontalCentered: true,
  verticalCentered: false,
  margins: { left:0.3, right:0.3, top:0.5, bottom:0.5, header:0.3, footer:0.3 }
};

// delimita el área de impresión completa (de B2 a L + última fila)
ws.pageSetup.printArea = `B2:L${lastRowLoc}`;

// Forzar ajuste de texto en toda la hoja LOCATIVO
ws.eachRow({ includeEmpty: true }, (row) => {
  row.eachCell({ includeEmpty: true }, (cell) => {
    const prev = cell.alignment || {};
    cell.alignment = { ...prev, wrapText: true };
  });
});

// --- Ajustar texto en todas las celdas usadas (LOCATIVO) ---
for(let R=2; R<=foot; R++){
  for(let C=2; C<=12; C++){
    const cell = ws.getCell(R, C);
    const a = cell.alignment || {};
    cell.alignment = {...a, wrapText:true};
  }
}

    // --- VENTA (vinculada a LOCATIVO) ---
    const wv = wb.addWorksheet('VENTA');
    wv.columns=[{width:3},{width:3},{width:3},{width:6},{width:8},{width:75},{width:22},{width:18}];

    wv.mergeCells(3,4,3,8);
    const green={type:'pattern',pattern:'solid',fgColor:{argb:'FF92D050'}};
    const thinB={style:'thin',color:{argb:'FF000000'}}, boxThin={top:thinB,left:thinB,bottom:thinB,right:thinB};
    const HDRv=['ITEM','CANT','DESCRIPCIÓN','V/UNIT','V/TOTAL'];
    for(let i=0;i<HDRv.length;i++){
      const cell=wv.getCell(4,4+i);
      cell.value=HDRv[i]; cell.fill=green; cell.font={bold:true};
      cell.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cell.border=boxThin;
    }

    const showRef = ($('#mostrarRef').value==='SI');
let rr=5;
items.forEach((it,i)=>{
  const loc = 10 + i; // fila en LOCATIVO (dataStart = 10)
  wv.getCell(rr,4).value = { formula:`LOCATIVO!B${loc}` }; // ITEM
  wv.getCell(rr,5).value = { formula:`LOCATIVO!D${loc}` }; // CANT
wv.getCell(rr,4).alignment = { horizontal:'center', vertical:'middle' };
wv.getCell(rr,5).alignment = { horizontal:'center', vertical:'middle' };
wv.getCell(rr,7).alignment = { horizontal:'center', vertical:'middle' };
wv.getCell(rr,8).alignment = { horizontal:'center', vertical:'middle' };

  // Disponibilidad directa del aplicativo como literal de Excel (escapando comillas)
  const disp = (it.disponibilidad || '').replace(/"/g,'""');

  const descFormula = (showRef)
    ? `LOCATIVO!E${loc}&CHAR(10)&"Ref: "&LOCATIVO!C${loc}&CHAR(10)&"Disponibilidad: "&"${disp}"`
    : `LOCATIVO!E${loc}&CHAR(10)&"Disponibilidad: "&"${disp}"`;

  wv.getCell(rr,6).value = { formula: descFormula };
  wv.getCell(rr,6).alignment = { vertical:'top', horizontal:'left', wrapText:true };

  wv.getCell(rr,7).value = { formula:`LOCATIVO!K${loc}` }; // V/Unit
  wv.getCell(rr,8).value = { formula:`LOCATIVO!L${loc}` }; // V/Total
  wv.getCell(rr,7).numFmt = '"$" #,##0';
  wv.getCell(rr,8).numFmt = '"$" #,##0';

  for(let c=4;c<=8;c++) wv.getCell(rr,c).border=boxThin;
  rr++;
});

// === RESUMEN FINAL EN VENTA (con descuento total de la oferta) ===
const last = rr - 1; // última fila con ítems (rr ya está una por debajo)
const descOfertaPct = Math.min(4, Math.max(0, Number($('#descOferta')?.value || 0))) / 100;

if (descOfertaPct > 0) {
  const rowSub  = last + 1;
  const rowDesc = rowSub + 1;
  const rowTot  = rowDesc + 1;
  const rowIva  = rowTot + 1;

  // SUBTOTAL
  wv.mergeCells(rowSub, 4, rowSub, 7);
  wv.getCell(rowSub, 4).value = 'SUBTOTAL';
  wv.getCell(rowSub, 4).alignment = { horizontal: 'right', vertical: 'middle' };
  wv.getCell(rowSub, 8).value = { formula: `SUM(H5:H${last})` };
  wv.getCell(rowSub, 8).numFmt = '"$" #,##0';
  wv.getCell(rowSub, 8).alignment = { horizontal:'right', vertical:'middle' };

  // DESCUENTO
  wv.mergeCells(rowDesc, 4, rowDesc, 7);
  wv.getCell(rowDesc, 4).value = `DESCUENTO (${Math.round(descOfertaPct*100)}%)`;
  wv.getCell(rowDesc, 4).alignment = { horizontal: 'right', vertical: 'middle' };
  wv.getCell(rowDesc, 8).value = { formula: `H${rowSub}*${descOfertaPct}` };
  wv.getCell(rowDesc, 8).numFmt = '"$" #,##0';
  wv.getCell(rowDesc, 8).alignment = { horizontal:'right', vertical:'middle' };

  // TOTAL
  wv.mergeCells(rowTot, 4, rowTot, 7);
  wv.getCell(rowTot, 4).value = 'TOTAL';
  wv.getCell(rowTot, 4).font = { bold: true };
  wv.getCell(rowTot, 4).alignment = { horizontal: 'right', vertical: 'middle' };
  wv.getCell(rowTot, 8).value = { formula: `H${rowSub}-H${rowDesc}` };
  wv.getCell(rowTot, 8).numFmt = '"$" #,##0';
  wv.getCell(rowTot, 8).alignment = { horizontal:'right', vertical:'middle' };

  // IVA NO INCLUIDO
  wv.mergeCells(rowIva, 4, rowIva, 8);
  wv.getCell(rowIva, 4).value = 'IVA NO INCLUIDO';
  wv.getCell(rowIva, 4).alignment = { horizontal: 'center', vertical: 'middle' };
  wv.getCell(rowIva, 4).font = { bold: true };

  // Estética
  for (const r of [rowSub, rowDesc, rowTot, rowIva]) {
    for (let c = 4; c <= 8; c++) {
      const cell = wv.getCell(r, c);
      cell.fill  = green;
      cell.border = boxThin;
    }
  }

  // --- Ajustar texto en todas las celdas usadas (VENTA) ---
  for(let R=4; R<=rowIva; R++){
    for(let C=4; C<=8; C++){
      const cell = wv.getCell(R, C);
      const a = cell.alignment || {};
      cell.alignment = {...a, wrapText:true};
    }
  }

} else {
  const rowTot = last + 1;
  const rowIva = rowTot + 1;

  // TOTAL
  wv.mergeCells(rowTot, 4, rowTot, 7);
  wv.getCell(rowTot, 4).value = 'TOTAL';
  wv.getCell(rowTot, 4).font = { bold: true };
  wv.getCell(rowTot, 4).alignment = { horizontal: 'right', vertical: 'middle' };
  wv.getCell(rowTot, 8).value = { formula: `SUM(H5:H${last})` };
  wv.getCell(rowTot, 8).numFmt = '"$" #,##0';
  wv.getCell(rowTot, 8).alignment = { horizontal:'right', vertical:'middle' };

  // IVA NO INCLUIDO
  wv.mergeCells(rowIva, 4, rowIva, 8);
  wv.getCell(rowIva, 4).value = 'IVA NO INCLUIDO';
  wv.getCell(rowIva, 4).alignment = { horizontal: 'center', vertical: 'middle' };
  wv.getCell(rowIva, 4).font = { bold: true };

  for (const r of [rowTot, rowIva]) {
    for (let c = 4; c <= 8; c++) {
      const cell = wv.getCell(r, c);
      cell.fill  = green;
      cell.border = boxThin;
    }
  }

  // --- Ajustar texto en todas las celdas usadas (VENTA) ---
  for(let R=4; R<=rowIva; R++){
    for(let C=4; C<=8; C++){
      const cell = wv.getCell(R, C);
      const a = cell.alignment || {};
      cell.alignment = {...a, wrapText:true};
    }
  }
}

// === Configuración de impresión (VENTA) ===
const venLastRow = wv.lastRow.number;
wv.pageSetup = {
  fitToPage: true,
  fitToWidth: 1,
  fitToHeight: 1,
  orientation: 'landscape',        // horizontal
  horizontalCentered: true,
  verticalCentered: false,
  margins: { left:0.3, right:0.3, top:0.5, bottom:0.5, header:0.3, footer:0.3 }
};

// delimita el área de impresión (de D3 a H + última fila)
wv.pageSetup.printArea = `D3:H${venLastRow}`;

// Forzar ajuste de texto
wv.eachRow({ includeEmpty: true }, (row) => {
  row.eachCell({ includeEmpty: true }, (cell) => {
    const prev = cell.alignment || {};
    cell.alignment = { ...prev, wrapText: true };
  });
});

// ===== DESCARGA COMPATIBLE (GitHub Pages / iframe) =====
const buf = await wb.xlsx.writeBuffer({ useStyles: true });
const blob = new Blob([buf], {
  type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
});
const fileName = (($('#outName').value || 'Q0000-AAA-25') + '.xlsx');

// 1) Si estamos embebidos en el portal, pedir a la página padre que haga la descarga
if (window.parent && window.parent !== window) {
  try {
    const ab = await blob.arrayBuffer();
    window.parent.postMessage({
      __ingetes_download: true,
      fileName,
      mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      buffer: ab
    }, '*');
  } catch (e) {
    console.error(e);
    // fallback local si falla postMessage
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }
}
// 2) Si NO está en iframe: intentar File Picker y si no, <a download>
else if ('showSaveFilePicker' in window) {
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: fileName,
      types: [{
        description: 'Archivo Excel',
        accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
      }]
    });
    const writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
    alert('Archivo guardado correctamente.');
  } catch (err) {
    // Usuario canceló o no está permitido -> fallback <a download>
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }
}
// 3) Último recurso: <a download>
else {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
  });
})();

const descInp = document.querySelector('#descOferta');
descInp?.addEventListener('input', () => {
  const v = Number(descInp.value || 0);
  if (v > 4) descInp.value = 4;
});

</script>
</body>
</html>
