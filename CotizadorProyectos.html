<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cotizador de Proyectos — INGETES</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --border:#e5e7eb; --muted:#6b7280; --text:#0b1020;
    --input-bg:#ffffff; --input-border:#d1d5db; --input-placeholder:#9ca3af;
    --btn:#111827; --btn-border:#0b0f19; --btnText:#ffffff; --table-head:#f1f5f9; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:24px 16px;border-bottom:1px solid var(--border);background:#fff}
  header h1{margin:0;font-size:24px;font-weight:800}
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
  .grid{display:grid;gap:16px}
  .two{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:900px){.two{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px}
  .pad{padding:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;padding:10px 12px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:10px;outline:none}
  input::placeholder,textarea::placeholder{color:var(--input-placeholder)}
  input:focus,select:focus,textarea:focus{border-color:#9aa7b4;box-shadow:0 0 0 3px rgba(2,132,199,.15)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:#f3f4f6;color:var(--text);cursor:pointer;font-weight:600}
  .btn.primary{background:var(--btn);color:var(--btnText);border-color:var(--btn-border)}
  .btn:hover{filter:brightness(1.04)}
  small.hint{color:#6b7280}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#eef2f7;border:1px solid var(--border);font-size:12px;color:#111827}
  .hidden{display:none!important}
  .input-error{border-color:#dc2626 !important; box-shadow:0 0 0 2px rgba(220,38,38,.20) !important;}
/* ======== ESTILO DE CAMPOS OBLIGATORIOS ======== */
label.required::after {
  content: " *";
  color: #dc2626; /* rojo */
}

.input-error {
  border-color: #dc2626 !important;
  box-shadow: 0 0 0 3px rgba(220,38,38,0.2) !important;
}

input:focus, select:focus, textarea:focus {
  border-color: #2563eb !important; /* azul */
  box-shadow: 0 0 0 3px rgba(37,99,235,0.2) !important;
}
</style>

<script>
// ===== Carga de librerías =====
(function(){
  function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.crossOrigin='anonymous';s.defer=true;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+u));document.head.appendChild(s);});}
  const XLSX_URLS=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
  const DOCX_URLS=['https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js','https://unpkg.com/docx@8.5.0/build/index.umd.js'];
  window.ensureXLSX=async()=>{if(window.XLSX) return XLSX; for(const u of XLSX_URLS){try{await loadScript(u); if(window.XLSX) return XLSX;}catch(e){}} throw new Error('XLSX no disponible');};
  window.ensureDOCX=async()=>{if(window.docx) return docx; for(const u of DOCX_URLS){try{await loadScript(u); if(window.docx) return docx;}catch(e){}} throw new Error('docx no disponible');};
  window.ensureExcelJS=async()=>{ if(window.ExcelJS) return ExcelJS; await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"); if(!window.ExcelJS) throw new Error('ExcelJS no disponible'); return ExcelJS; };
})();

// === Constantes/reutiles de formato (idénticas al generador WORD) ===
const INCH_TO_TWIP=i=>Math.round(i*1440), INCH_TO_PX=i=>Math.round(i*96), CM_TO_TWIP=cm=>Math.round((cm/2.54)*1440);
const SPACING_SINGLE={line:240,before:0,after:0};
const FONTS={ MSS12:{font:'Microsoft Sans Serif',size:24}, TNR12:{font:'Times New Roman',size:24}, AR10:{font:'Arial',size:20}, MSS9:{font:'Microsoft Sans Serif',size:18} };
const run=(text,spec,opts={})=>new docx.TextRun(Object.assign({text},spec,opts));
const para=(children,align)=>new docx.Paragraph({children,spacing:SPACING_SINGLE,alignment:align});

// === Marca de agua / fondo (idéntico al generador WORD) ===
async function downscaleToJpeg(arrayBuffer, maxW=1275, maxH=1650, quality=0.72){
  const blob = new Blob([arrayBuffer]); const img = await createImageBitmap(blob);
  const ratio = Math.min(maxW/img.width, maxH/img.height, 1);
  const canvas = document.createElement('canvas'); canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
  const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', quality); const res = await fetch(dataUrl); return await res.arrayBuffer();
}
let DEFAULT_BG_BUF = null; let DEFAULT_BG_NAME = '';
async function loadDefaultBackground(){
  const candidates=['MarcaDeAgua.png','MarcaDeAgua.jpg','marcadeagua.png','marcadeagua.jpg','fondo.png','background.png'];
  for(const name of candidates){
    try{ const resp=await fetch(name,{cache:'no-store'}); if(!resp.ok) continue;
      const buf=await resp.arrayBuffer(); DEFAULT_BG_BUF=await downscaleToJpeg(buf); DEFAULT_BG_NAME=name; return;
    }catch(_){/*ignora*/}}
}


// ========= Excel de contactos (idéntico al Word) =========
let CONTACTS_DB = { byEmpresa: new Map(), all: [] };

// utilidades de normalización
function _normStr(s){ return (s||'').toString().trim(); }
function _normKey(s){
  return _normStr(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // sin acentos
}

// Lee el workbook y detecta columnas como en el Word:
// - “Nombre de la cuenta” para EMPRESA
// - “Nombre”, “Apellidos”, “Cargo”, “Teléfono/Móvil”, “Correo electrónico”, “Ciudad o País”
async function parseContactsWorkbook(arrayBuffer){
  const XLSX = await ensureXLSX();
  const wb = XLSX.read(arrayBuffer, { type:'array', cellStyles:false });
  const ws = wb.Sheets[wb.SheetNames[0]];         // 1ª hoja
  if(!ws) throw new Error('No se encontró hoja de contactos');

  const range = XLSX.utils.decode_range(ws['!ref']||'A1');
  const getCell = (r,c)=>{
    const a = XLSX.utils.encode_cell({r,c});
    const cell = ws[a];
    if(!cell) return '';
    if(typeof cell.w === 'string') return cell.w;
    return cell.v==null ? '' : String(cell.v);
  };

  // 1) localizar fila de encabezados (como en Word)
  let headerRow = -1, cols = {};
  for(let r=range.s.r; r<=range.e.r; r++){
    const names = [];
    for(let c=range.s.c; c<=range.e.c; c++) names.push(_normKey(getCell(r,c)));

// Empresa: “Nombre de la cuenta” o similares
const idxEmpresa = names.findIndex(v =>
  v.includes('nombre de la cuenta') || v.includes('cuenta')
);

// Nombre: cualquier columna que contenga “nombre” pero NO “cuenta”
const idxNombre = names.findIndex(v =>
  v.includes('nombre') && !v.includes('cuenta')
);

// Apellidos: “apellidos” o “apellido”
const idxApell = names.findIndex(v =>
  v.includes('apellidos') || v.includes('apellido')
);

// Cargo
const idxCargo = names.findIndex(v => v.includes('cargo'));

// Teléfono/Móvil/Correo/Ciudad (más permisivos)
const idxTel   = names.findIndex(v => v.startsWith('telefono') || v.includes('tel'));
const idxMovil = names.findIndex(v => v.startsWith('movil')    || v.includes('cel'));
const idxEmail = names.findIndex(v => v.includes('correo')     || v.includes('email'));
const idxCiudad= names.findIndex(v => v.startsWith('ciudad')   || v.includes('país') || v.includes('pais'));

    if (idxEmpresa>=0 && idxNombre>=0 && idxApell>=0 && idxEmail>=0){
      headerRow = r;
      cols = { empresa:idxEmpresa, nombre:idxNombre, apellidos:idxApell, cargo:idxCargo,
               telefono:idxTel, movil:idxMovil, email:idxEmail, ciudadPais:idxCiudad };
      break;
    }
  }
  if(headerRow < 0) throw new Error('No se detectaron encabezados en el Excel de contactos');

  // 2) recorrer filas con “arrastre” de empresa y omitir “Subtotal”
  const rows = [];
  let lastEmpresa = '';
  for(let r=headerRow+1; r<=range.e.r; r++){
    const vEmpresa = _normStr(getCell(r, cols.empresa));
    const vNombre  = _normStr(getCell(r, cols.nombre));
    const vApell   = _normStr(getCell(r, cols.apellidos));
    const vCargo   = _normStr(cols.cargo!=null ? getCell(r, cols.cargo) : '');
    const vTel     = _normStr(cols.telefono!=null ? getCell(r, cols.telefono) : '');
    const vMovil   = _normStr(cols.movil!=null ? getCell(r, cols.movil) : '');
    const vEmail   = _normStr(cols.email!=null ? getCell(r, cols.email) : '');
    const vCiudad  = _normStr(cols.ciudadPais!=null ? getCell(r, cols.ciudadPais) : '');

    const line = [vEmpresa, vNombre, vApell, vEmail].join(' ').toLowerCase();
    if (line.includes('subtotal') || (!vNombre && !vApell && !vEmail)) continue;

    if (vEmpresa) lastEmpresa = vEmpresa;
    const empresa = lastEmpresa;
    if (!empresa) continue;

    rows.push({
      id: rows.length,
      empresa,
      nombre: vNombre,
      apellidos: vApell,
      cargo: vCargo,
      telefono: vTel,
      movil: vMovil,
      email: vEmail,
      ciudadPais: vCiudad
    });
  }

  // 3) agrupar por empresa
  const byEmpresa = new Map();
  rows.forEach(r=>{
    const key = r.empresa;
    if(!byEmpresa.has(key)) byEmpresa.set(key, []);
    byEmpresa.get(key).push(r);
  });

  return { byEmpresa, all: rows };
}

// Pinta empresas (usa <select id="empresa"> y el buscador #empresaSearch)
function fillEmpresaOptions(){
  const selEmp = document.getElementById('empresa');
  const selDir = document.getElementById('dirigido');
  if(!selEmp || selEmp.tagName!=='SELECT') return;

  selEmp.innerHTML = '<option value="" selected disabled>-Seleccionar empresa-</option>';
  selDir.innerHTML = '<option value="" selected disabled>-Selecciona primero una empresa-</option>';
  selDir.disabled = false;

  const empresas = Array.from(CONTACTS_DB.byEmpresa.keys())
    .sort((a,b)=>a.localeCompare(b,'es'));

  empresas.forEach(e=>{
    const opt = document.createElement('option');
    opt.value = e.toUpperCase();
    opt.textContent = e.toUpperCase();
    opt.dataset.empraw = e;  // nombre original para buscar contactos
    selEmp.appendChild(opt);
  });

  const status = document.getElementById('xlsDatosStatus');
  if (status) status.textContent = `Empresas: ${empresas.length} • Contactos: ${CONTACTS_DB.all.length}`;
}

// Pinta dirigidos y deja data-* con email/telefonos/ciudad para autollenar
function fillDirigidoOptions(){
  const selEmp = document.getElementById('empresa');
  const selDir = document.getElementById('dirigido');
  const dirSearch = document.getElementById('dirigidoSearch');
  if(!selEmp || !selDir) return;

  const empRaw = selEmp.selectedOptions[0]?.dataset?.empraw || '';
  selDir.innerHTML = '<option value="" selected disabled>-Seleccionar persona-</option>';
  selDir.disabled = false;
  if (dirSearch) { dirSearch.value=''; dirSearch.disabled = false; }

  const lista = CONTACTS_DB.byEmpresa.get(empRaw) || [];
  lista.forEach(c=>{
    const cargoNorm = _normKey(c.cargo);
    const isIng = /\b(ing(\.?|\b)|ingenier\w*)/.test(cargoNorm);
    const etiqueta = (isIng ? 'ING. ' : 'SR(A). ') + `${c.nombre} ${c.apellidos}`.trim();

    const opt = document.createElement('option');
    opt.value = etiqueta.toUpperCase();
    opt.textContent = etiqueta.toUpperCase();
    opt.dataset.cid    = String(c.id);
    opt.dataset.tel    = (c.telefono   || '').trim();
    opt.dataset.movil  = (c.movil      || '').trim();
    opt.dataset.email  = (c.email      || '').trim();
    opt.dataset.ciudad = (c.ciudadPais || '').trim();
    selDir.appendChild(opt);
  });

if (lista.length === 1) { 
  selDir.selectedIndex = 1; 
  onDirigidoChange(); 
  syncDirigidoInputs();
} else {
  const dirSearch = document.getElementById('dirigidoSearch');
  if (dirSearch) dirSearch.value = '';
}
}

// combos con buscador (input arriba del select)
function normalizeStr(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}
function attachSearchableCombo(selectId, inputId, { onCommit, matchMode='includes' } = {}){
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if (!sel || !inp) return;

  let customOpt = sel.querySelector('option[data-custom="1"]') || null;
  const norm = s => normalizeStr(s);

  function resetFilter(){ Array.from(sel.options).forEach(o=>o.hidden=false); }
  function filterOptions(q){
    const Q = norm(q);
    Array.from(sel.options).forEach((opt, idx)=>{
      const txt = norm(opt.textContent||opt.value||'');
      if (idx===0 && opt.disabled){ opt.hidden=false; return; }
      if (!Q){ opt.hidden=false; return; }
      opt.hidden = (matchMode==='startsWith') ? !txt.startsWith(Q) : !txt.includes(Q);
    });
  }

  function commitFreeTextToSelect(){
    const valTyped = norm(inp.value);
    if (!valTyped) return '';
    const exact = Array.from(sel.options).find(o => norm(o.textContent||o.value||'') === valTyped);
    if (exact){ sel.value = exact.value; return (exact.textContent||exact.value||'').toUpperCase(); }
    if (!customOpt || !sel.contains(customOpt)) {
      customOpt = document.createElement('option');
      customOpt.dataset.custom = '1';
      sel.appendChild(customOpt);
    }
    customOpt.value = valTyped;
    customOpt.textContent = valTyped;
    customOpt.hidden = false;
    sel.value = customOpt.value;
    return valTyped;
  }

sel.addEventListener('change', ()=>{
  const opt = sel.selectedOptions[0];
  if (opt){
    inp.value = (opt.textContent||opt.value||'').toUpperCase();
    if (typeof onCommit === 'function') onCommit();
    if (selectId === 'dirigido') syncDirigidoInputs();  // <<< asegura espejo en input
  }
});

  inp.addEventListener('input', ()=>{
    const pos = inp.selectionStart;
    inp.value = inp.value.toUpperCase();
    if (typeof pos === 'number') inp.setSelectionRange(pos, pos);
    resetFilter(); filterOptions(inp.value);

    if (selectId === 'dirigido'){
      const exact = Array.from(sel.options).find(o => normalizeStr(o.textContent||o.value||'') === normalizeStr(inp.value));
      if (!exact){ ['email','office','ubicacion','tel'].forEach(id => { const el = document.getElementById(id); if (el) el.value=''; }); }
    }
  });

  inp.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter'){
      e.preventDefault(); e.stopPropagation();
      const confirmed = commitFreeTextToSelect();
      if (confirmed) inp.value = confirmed;
      if (typeof onCommit === 'function') onCommit();
    }
  });

  inp.addEventListener('blur', ()=>{
    const confirmed = commitFreeTextToSelect();
    if (confirmed) inp.value = confirmed;
    if (typeof onCommit === 'function') onCommit();
  });
}

function onEmpresaChange(){
  const selDir = document.getElementById('dirigido');
  const email = document.getElementById('email');
  const office = document.getElementById('office');
  const ubic = document.getElementById('ubicacion');
  const empSearch = document.getElementById('empresaSearch');
  const selEmp = document.getElementById('empresa');
  const opt = selEmp && selEmp.selectedOptions[0];
  if (empSearch) empSearch.value = opt ? (opt.textContent||opt.value||'').toUpperCase() : '';
  if (selDir) selDir.innerHTML = '<option value="" selected disabled>-Seleccionar persona-</option>';
  if (email) email.value = '';
  if (office) office.value = '';
  if (ubic) ubic.value = '';
  fillDirigidoOptions();
  const dirSearch = document.getElementById('dirigidoSearch');
  if (dirSearch) dirSearch.value = '';
}

function onDirigidoChange(){
  const selDir = document.getElementById('dirigido');
  const email  = document.getElementById('email');
  const office = document.getElementById('office');
  const tel    = document.getElementById('tel');
  const ubic   = document.getElementById('ubicacion');
  const opt    = selDir && selDir.selectedOptions[0];

  const clearAuto = () => {
    if (email)  email.value  = '';
    if (office) office.value = '';
    if (ubic)   ubic.value   = '';
    if (tel)    tel.value    = '';
  };

  if (!opt) { clearAuto(); return; }
  let tFijo  = (opt.dataset.tel    || '').trim();
  let tMovil = (opt.dataset.movil  || '').trim();
  let mail   = (opt.dataset.email  || '').trim();
  let city   = (opt.dataset.ciudad || '').trim();

  if (!tFijo && !tMovil && !mail && !city && opt.dataset.cid != null) {
    const idx = Number(opt.dataset.cid);
    const c   = CONTACTS_DB.all[idx];
    if (c) {
      tFijo  = (c.telefono   || '').trim();
      tMovil = (c.movil      || '').trim();
      mail   = (c.email      || '').trim();
      city   = (c.ciudadPais || '').trim();
    }
  }

  if (!tFijo && !tMovil && !mail && !city) { clearAuto(); return; }

  if (email) email.value = mail;
  if (ubic)  ubic.value  = city;

  let officeVal = '';
  let telVal    = '';
  if (tFijo) { officeVal = tFijo; telVal = tMovil || ''; }
  else if (tMovil) { officeVal = tMovil; telVal = tMovil; }

  if (office) office.value = officeVal;
  if (tel)    tel.value    = telVal;
}

function syncDirigidoInputs(){
  const sel = document.getElementById('dirigido');
  const inp = document.getElementById('dirigidoSearch');
  if (!inp) return;
  const opt = sel && sel.selectedOptions && sel.selectedOptions[0];
  inp.value = opt ? (opt.textContent || opt.value || '').toUpperCase() : '';
}

// Conecta el input de archivo de contactos + combos
function wireContactsInput(){
  const input = document.getElementById('xlsDatos');
  const status = document.getElementById('xlsDatosStatus');
  if (!input) return;

  input.addEventListener('change', async ()=>{
    const f = input.files && input.files[0];
    if (!f){ CONTACTS_DB = {byEmpresa:new Map(), all:[]}; fillEmpresaOptions(); return; }
    try{
      const buf = await f.arrayBuffer();
      CONTACTS_DB = await parseContactsWorkbook(buf);
      fillEmpresaOptions();
      if(status) status.textContent = `${f.name} • ${(f.size/1024/1024).toFixed(2)} MB (cargado)`;
    }catch(e){
      console.error(e);
      alert('No se pudo leer el Excel de contactos: ' + (e.message||e));
      if(status) status.textContent='Error al leer el archivo';
    }
  });

  document.getElementById('empresa')?.addEventListener('change', onEmpresaChange);
  document.getElementById('dirigido')?.addEventListener('change', onDirigidoChange);

  attachSearchableCombo('empresa','empresaSearch', { onCommit:onEmpresaChange, matchMode:'includes' });
  attachSearchableCombo('dirigido','dirigidoSearch', { onCommit:onDirigidoChange, matchMode:'includes' });
}

// Autodetectar archivo de contactos en la misma carpeta (patrones del Word)
function buildContactFilenameCandidates(){
  const baseURL = new URL('.', location.href);
  const list = [];
  list.push(new URL('informedeContactos.xlsx', baseURL).href); // exacto
  ['informe de Contactos para PORTAL.xlsx',
   'informe de Contactos para PORTAL-latest.xlsx',
   'Contactos_PORTAL.xlsx',
   'Contactos.xlsx',
   'informe de Contactos para PORTAL-2025-09-30-08-58-01.xlsx'
  ].forEach(n => list.push(new URL(n, baseURL).href));

  // YYYY-MM-DD y YYYY-MM-DD-hh-mm-ss (incluye “01” por tu patrón)
  const nowUTC = new Date(); const today = new Date(nowUTC.getTime() - (5*60*60*1000));
  const y = today.getUTCFullYear(), m = String(today.getUTCMonth()+1).padStart(2,'0'), d = String(today.getUTCDate()).padStart(2,'0');
  const stamp = `${y}-${m}-${d}`;
  list.push(new URL(`informe de Contactos para PORTAL-${stamp}.xlsx`, baseURL).href);
  for(let hh=0; hh<24; hh++){
    for(const mm of [58,0,30,15,45]){   // minutos frecuentes
      for(const ss of ['00','30','01']){
        const H = String(hh).padStart(2,'0'), M = String(mm).padStart(2,'0');
        list.push(new URL(`informe de Contactos para PORTAL-${stamp}-${H}-${M}-${ss}.xlsx`, baseURL).href);
      }
    }
  }
  return list;
}

async function fetchExcelArrayBuffer(url){
  const res = await fetch(url, { cache:'no-store' });
  if (!res.ok) throw new Error('No se pudo obtener: '+url);
  return await res.arrayBuffer();
}

async function autoDetectContactsInSameFolder(){
  const status = document.getElementById('xlsDatosStatus');
  if (status) status.textContent = 'Buscando Excel de contactos en la carpeta…';

  const candidates = (function buildContactFilenameCandidates(){
    const baseURL = new URL('.', location.href);
    return [
      new URL('informedeContactos.xlsx', baseURL).href,
      new URL('informe de Contactos para PORTAL.xlsx', baseURL).href,
      new URL('Contactos_PORTAL.xlsx', baseURL).href,
      new URL('Contactos.xlsx', baseURL).href
    ];
  })();

  for (const url of candidates){
    try{
      const buf = await fetchExcelArrayBuffer(url); // ya está definida arriba
      CONTACTS_DB = await parseContactsWorkbook(buf);
      fillEmpresaOptions();
      hideContactsUploadUI(); // oculta el uploader si se encontró
      if (status) status.textContent = 'Contactos cargados automáticamente ✓';
      return true;
    }catch(_){
      // sigue con el siguiente candidato
    }
  }
  if (status) status.textContent = 'No se encontró Excel de contactos automáticamente. Selecciónalo manualmente.';
  return false;
}

    const id = el.id || '';
    if (keep.has(id)) return;                 // conservar marca de agua y contactos

    // a) archivos: limpiar SOLO los 4 excels de cotización
    if (el.type === 'file'){
      if (['fileNormal','fileImp','fileTab','fileIng'].includes(id)) el.value = '';
      return;
    }

    // b) selects
    if (el.tagName === 'SELECT'){
      // empresa: conservar opciones pero deseleccionar
      if (id === 'empresa'){
        el.selectedIndex = 0;                 // vuelve al placeholder

      }
      // dirigido: volver al placeholder base
      if (id === 'dirigido'){
        el.innerHTML = '<option value="" selected disabled>-Selecciona primero una empresa-</option>';
        el.disabled = false;
        return;
      }
      // resto de selects (garantía, forma de pago, etc.)
      el.selectedIndex = 0;
      return;
    }

    // c) textareas
    if (el.tagName === 'TEXTAREA'){ el.value = ''; return; }

    // d) inputs de texto (incluye los “combo-input” de búsqueda)
    el.value = '';
  });

  // 4) ocultar/limpiar campos "Otro"
  ['garantia','formaPago','sitioEntrega','validezOferta','precios'].forEach(id=>{
    const o = document.getElementById(id + '_otro');

  });

  // 6) estado visual y scroll
  const log = document.getElementById('log');
  if (log) log.textContent = 'Formulario reiniciado (se conservó la marca de agua y el Excel de contactos).';
  try{ window.scrollTo({ top: 0, behavior: 'smooth' }); }catch(_){}
}

function pickVentaSheetName(wb){
  // Priorizar hojas llamadas "VENTA" o que contengan ese texto
  const names = wb.SheetNames || [];
  const exact = names.find(n=>n.trim().toUpperCase()==='VENTA');
  if (exact) return exact;
  const like  = names.find(n=>n.toUpperCase().includes('VENTA'));
  return like || names[0];
}

function a1ToMatrix(ws){
  // Convierte la hoja a matriz [ [c0,c1,...], ... ] y recorta filas/columnas vacías
  const raw = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  if (!raw || !raw.length) return [];
  // Trim filas vacías
  const nonEmptyRows = raw.filter(row => (row||[]).some(cell => String(cell).trim()!==''));
  if (!nonEmptyRows.length) return [];
  // Determinar primeras/últimas columnas no vacías
  let minC=Infinity, maxC=-1;
  nonEmptyRows.forEach(r=>{
    r.forEach((v,i)=>{ if(String(v).trim()!==''){ if(i<minC) minC=i; if(i>maxC) maxC=i; } });
  });
  if (!isFinite(minC) || maxC<0) return [];
  return nonEmptyRows.map(r=> r.slice(minC, maxC+1));
}

function normalizeHeader(row){
  // Devuelve una copia con strings normalizados (pero mantenemos original para docx)

async function readVentaMatrixFromFile(file){
  if(!file) return null;
  const buf = await file.arrayBuffer();
  const XLSX = await ensureXLSX();
  const wb = XLSX.read(buf, { type:'array' });
  const shName = pickVentaSheetName(wb);
  const ws = wb.Sheets[shName];
  if(!ws) return { name:file.name, sheet:shName, matrix:[] };
  const matrix = a1ToMatrix(ws);
  return { name:file.name, sheet:shName, matrix };

    if (val === '') {

});

  // al menos 2 excels

// Normaliza/parsea monedas tipo "$ 1.234.567,89"
function parseCOP(v){
  if (v == null) return 0;
  const s = String(v).toUpperCase().replace(/[^\d,.-]/g, '')
    .replace(/\.(?=\d{3}(\D|$))/g,'')   // quitar puntos de miles
    .replace(',', '.');                 // coma → punto decimal
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function fmtCOP(n){
  return new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 }).format(n||0);
}

// Localiza columnas ITEM/CANT/DESCRIPCIÓN/V/UNIT/V/TOTAL en una matriz
function localizarIndicesCabecera(row){
  const norm = s => String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const cols = row.map(norm);
  const find = (rxs) => cols.findIndex(h => rxs.some(rx => rx.test(h)));

  return {
    item:  find([/^ITEM$/]),
    cant:  find([/^CANT$/, /^CANTIDAD$/]),
    desc:  find([/^DESCRIPCION$/, /^DESCRIPCIÓN$/]),
    vunit: find([/^V[\/\s]*UNIT$/, /^V[\/\s]*UNITARIO$/, /^P\.?\s*UNIT/i]),
    vtot:  find([/^V[\/\s]*TOTAL$/, /^TOTAL\s*ITEM$/])
  };
}

// Extrae los ítems de una hoja VENTA (matriz ya recortada)
function extraerItemsDeMatriz(mat){
  if (!mat || !mat.length) return { items:[], total:0 };

  let iCab = -1, idx = {};
  for (let r=0; r<Math.min(mat.length, 25); r++){
    const ids = localizarIndicesCabecera(mat[r]);
    if (ids.desc >= 0 && ids.vtot >= 0){
      idx = ids; iCab = r; break;
    }
  }
  if (iCab < 0) return { items:[], total:0 };

  const items = [];
  let total = 0;

 for (let r = iCab + 1; r < mat.length; r++) {
   const row = mat[r] || [];
   const rowTxt = row.map(v => String(v||'').toUpperCase());
   const firstText = rowTxt[0] || '';

   // Cortar cuando llegue el bloque de "IVA NO INCLUIDO"
   if (/IVA\s+NO\s+INCLUIDO/.test(firstText)) break;

   // Si esta fila es "TOTAL …" → acumular al total y seguir (no la tratamos como ítem)
   if (rowTxt.some(t => /^TOTAL\b/.test(t))) {
     const vtot = parseCOP(row[idx.vtot]);
     if (vtot) total += vtot;
     continue;
   }

   // Ignorar SUBTOTAL / DESCUENTO como ítems
   if (rowTxt.some(t => /^SUBTOTAL\b/.test(t))) continue;
   if (rowTxt.some(t => /^DESCUENTO\b/.test(t))) continue;

   // Ítems normales
   const desc = String(row[idx.desc] || '').trim();
   const vtot = parseCOP(row[idx.vtot]);
   if (!desc && !vtot) continue;

   const cant = (idx.cant >= 0) ? (parseFloat(String(row[idx.cant]).toString().replace(',','.')) || 0) : '';
   const item = (idx.item >= 0) ? String(row[idx.item] || '').trim() : '';

   items.push({
     item,
     cant: (cant || '').toString(),
     desc,
     vunit: (idx.vunit >= 0) ? parseCOP(row[idx.vunit]) : (vtot || 0),
     vtot
   });
 }

  return { items, total };
}

// Convierte File → matriz VENTA (reutiliza tus helpers)
async function leerMatrizVenta(file){
  if(!file) return null;
  const buf = await file.arrayBuffer();
  const XLSX = await ensureXLSX();
  const wb = XLSX.read(buf, { type:'array' });
  const sh = (wb.SheetNames||[]).find(n => n.trim().toUpperCase()==='VENTA') || wb.SheetNames[0];
  const ws = wb.Sheets[sh]; if(!ws) return null;
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  if(!raw || !raw.length) return null;

  // recortar filas/cols vacías
  const rows = raw.filter(r => (r||[]).some(c => String(c).trim()!==''));
  if(!rows.length) return null;
  let minC=Infinity, maxC=-1;
  rows.forEach(r => r.forEach((v,i) => { if(String(v).trim()!==''){ if(i<minC) minC=i; if(i>maxC) maxC=i; } }));
  if(!isFinite(minC)||maxC<0) return null;
  return rows.map(r => r.slice(minC, maxC+1));
}

// Construye la tabla DOCX consolidada (gris), Calibri 10.5,
function buildConsolidatedTable(docx, items, grandTotalOverride = null){
  const GRIS = 'E5E7EB';
  const A = docx.AlignmentType;
  const V = docx.VerticalAlign;
  const FONTE10_5 = { font:'Calibri', size:21 }; // 10.5 pt

  // Anchos requeridos (cm → twips)
  const colCm = [0.82, 0.85, 9.54, 2.30, 2.81];
  const colW  = colCm.map(cm => CM_TO_TWIP(cm));
  const totalW = colW.reduce((a,b)=>a+b,0);

  const P = (children, align) =>
    new docx.Paragraph({ spacing:{ line:240, before:0, after:0 }, alignment:align, children });

  const TR = (text, extra={}) => new docx.TextRun({ text, ...FONTE10_5, ...extra });

  // Centrado exacto en la celda (h: center y v: center)
  const Cell = (idx, children, {shading, valign=V.CENTER}={}) =>
    new docx.TableCell({
      width:{ size: colW[idx], type: docx.WidthType.DXA },
      verticalAlign: valign,
      shading,
      children
    });

  // --- "Descripción" con saltos de línea
  function paragraphDescripcion(raw){
    const s = String(raw||'').trim();

    // insertamos saltos antes de estas palabras clave
    const withBreaks = s
      .replace(/\s+(Ref\.?:)/i, '\n$1')
      .replace(/\s+(Disponibilidad:)/i, '\n$1')
      .replace(/\s+(Alcance:)/i, '\n$1')
      .replace(/\s+(Programación\b[^:\n]*:?-?\s*)/i, '\n$1')   // "Programación - 6 días" o "Programación:"
      .replace(/\s+(Configuración\b[^:\n]*:?-?\s*)/i, '\n$1'); // "Configuración - 3 días" o "Configuración:"

    const parts = withBreaks.split(/\n/).map(t => t.trim()).filter(Boolean);
    const runs = [];
    parts.forEach((t,i) => {
      if(i>0) runs.push(new docx.TextRun({break:1}));
      runs.push(TR(t));
    });
    if(!runs.length) runs.push(TR(''));
    return P(runs, A.LEFT);
  }

  const rows = [];

  // Franja superior
  rows.push(new docx.TableRow({
    children:[
      new docx.TableCell({
        columnSpan:5,
        width:{size: totalW, type: docx.WidthType.DXA},
        shading:{ fill: GRIS },
        verticalAlign: V.CENTER,
        children:[ P([TR('')], A.LEFT) ]
      })
    ]
  }));

  // Encabezado (centrado)
  const head = ['ITEM','CANT','DESCRIPCIÓN','V/UNIT','V/TOTAL'];
  rows.push(new docx.TableRow({
    children: head.map((h,i) =>
      Cell(i, [ P([ TR(h,{bold:true}) ], A.CENTER) ], { shading:{ fill: GRIS } })
    )
  }));

  // Filas de datos
  let granTotal = (grandTotalOverride != null) ? grandTotalOverride : 0;
  (items||[]).forEach(it=>{
    if (grandTotalOverride == null) {
      granTotal += (it.vtot || 0); // solo si no viene override
    }
    rows.push(new docx.TableRow({
      children:[
        Cell(0, [ P([ TR(String(it.item||'')) ], A.CENTER) ]),
        Cell(1, [ P([ TR(String(it.cant||'')) ], A.CENTER) ]),
        Cell(2, [ paragraphDescripcion(it.desc) ] , {valign: V.TOP}),    // descripción alineada arriba si crece
        Cell(3, [ P([ TR(fmtCOP(it.vunit||0)) ], A.CENTER) ]),
        Cell(4, [ P([ TR(fmtCOP(it.vtot||0)) ], A.CENTER) ])
      ]
    }));
  });

// TOTAL (texto a la izquierda, valor a la DERECHA) — redondeado hacia arriba
const granTotalRounded = Math.ceil(granTotal || 0);
rows.push(new docx.TableRow({
  children:[
    new docx.TableCell({
      columnSpan:4,
      width:{ size: colW.slice(0,4).reduce((a,b)=>a+b,0), type: docx.WidthType.DXA },
      shading:{ fill: GRIS },
      verticalAlign: V.CENTER,
      children:[ P([ TR('TOTAL', {bold:true}) ], A.RIGHT) ] // izquierda
    }),
    Cell(4, [ P([ TR(fmtCOP(granTotalRounded), {bold:true}) ], A.RIGHT) ], { shading:{ fill: GRIS } }) // derecha
  ]
}));

  // IVA NO INCLUIDO (centrado)
  rows.push(new docx.TableRow({
    children:[
      new docx.TableCell({
        columnSpan:5,
        width:{size: totalW, type: docx.WidthType.DXA},
        shading:{ fill: GRIS },
        verticalAlign: V.CENTER,
        children:[ P([ TR('IVA NO INCLUIDO', {bold:true}) ], A.CENTER) ]
      })
    ]
  }));

  // Franja inferior
  rows.push(new docx.TableRow({
    children:[
      new docx.TableCell({
        columnSpan:5,
        width:{size: totalW, type: docx.WidthType.DXA},
        shading:{ fill: GRIS },
        verticalAlign: V.CENTER,
        children:[ P([TR('')], A.LEFT) ]
      })
    ]
  }));

  return new docx.Table({
    width:{ size: totalW, type: docx.WidthType.DXA },
    rows
  });
}

  let __genLock = false;

async function generate(){
  if(!validarFormulario()) return;
  try{
    document.getElementById('log').textContent='Generando…';
    const docx = await ensureDOCX(); await ensureXLSX(); await ensureExcelJS();

    // 1) Cargar marca de agua (igual que Generador WORD)
    if(!DEFAULT_BG_BUF){ await loadDefaultBackground(); }
    if(!DEFAULT_BG_BUF) { alert('Debe cargar la imagen de fondo (marca de agua).'); document.getElementById('log').textContent=''; return; }
    
    // 2) Lee archivos según orden requerido (Normal → Importaciones → Tablero → Ingeniería)
    const fNormal = document.getElementById('fileNormal').files[0] || null;
    const fImp    = document.getElementById('fileImp').files[0]    || null;
    const fTab    = document.getElementById('fileTab').files[0]    || null;
    const fIng    = document.getElementById('fileIng').files[0]    || null;

    if(!fNormal && !fImp && !fTab && !fIng){
      alert('Sube al menos un Excel de cotización.'); document.getElementById('log').textContent=''; return;
    }

    // 3) Construye tablas DOCX desde la hoja VENTA (solo de los que existan)
const tables = [];
const files = [fNormal, fImp, fTab, fIng];

 for (let idx = 0; idx < files.length; idx++) {
   const f = files[idx];
   if (!f) { tables.push(null); continue; }
   const buf = await f.arrayBuffer();

   let color   = "92D050";     // color de franjas
   let fillAll = false;        // NO teñir toda la tabla
   let omitTop = false;    // pinta la franja superior si existe en TODAS
  let replaceGreenWith = null;
  let overrideColors = true; // <<— IGNORAR COLORES DEL EXCEL
  let palette = { spacer:"#92D050", header:"#92D050", total:"#92D050", iva:"#92D050" };

   if (idx === 1) { palette = { spacer:"#F4B183", header:"#F4B183", total:"#F4B183", iva:"#F4B183" }; }                 // Importaciones → naranja suave
   if (idx === 2) { palette = { spacer:"#FFE699", header:"#FFE699", total:"#FFE699", iva:"#FFE699" }; }                 // Tablero → amarillo suave
   if (idx === 3) {
  palette = { spacer:"#9BC2E6", header:"#9BC2E6", total:"#9BC2E6", iva:"#9BC2E6" };
  omitTop = false; // <- ahora SÍ colorea la franja superior azul si existe
}

  const t = await buildTableFromWorkbook(docx, buf, {
    omitTop, color, fillAll, replaceGreenWith,
    overrideColors, palette,
    addSpacers: false 
  });
   tables.push(t);
 }

// ====== Construir la TABLA CONJUNTA (gris) ======
 const allItems = [];
 let sumTotales = 0;

// Lee matrices y extrae ítems de cada archivo que exista (en orden)
const filesForItems = [fNormal, fImp, fTab, fIng];
for (const f of filesForItems){
  if (!f) continue;
  const mat = await leerMatrizVenta(f);
  const { items, total } = extraerItemsDeMatriz(mat || []);
  if (items && items.length) allItems.push(...items);
  sumTotales += (total || 0);
}

// Solo si hay filas, crea la tabla consolidada y la agrega al final
if (allItems.length){
  const tableConsolidada = buildConsolidatedTable(docx, allItems, sumTotales);
  tables.push(tableConsolidada);
}

    // 4) Arma el documento con el MISMO formato y varias tablas
    const baseName = (document.getElementById('outName').value || 'PROYECTO-COTIZACIONES');
    const doc = buildDocCommonMulti(docx, baseName, DEFAULT_BG_BUF, tables.filter(Boolean));

// 5) Descarga (File Picker + delegación al portal + fallback)
const blob = await docx.Packer.toBlob(doc);
const name = baseName + '.docx';

// 5.1 File Picker nativo
if ('showSaveFilePicker' in window){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: name,
      types: [{ description:'Documento Word',
        accept:{ 'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx'] } }]
    });
    const w = await handle.createWritable(); await w.write(blob); await w.close();
    document.getElementById('log').textContent = 'Documento guardado.';
    return;
  }catch(e){
    if (e && e.name === 'AbortError'){ document.getElementById('log').textContent='Operación cancelada'; return; }
    // si falla diferente a cancelación, seguimos al siguiente paso
  }
}

// 5.2 Si está embebido en el Portal, delega y EVITA fallback
try{
  if (window.parent !== window.self){
    const arrBuf = await blob.arrayBuffer();
    window.parent.postMessage({
      __ingetes_download: true,
      filename: name,
      mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      buffer: arrBuf
    }, '*');
    return; // <<< evita descarga doble
  }
}catch(_){ /* ignorar y continuar */ }

// 5.3 Fallback universal: <a download>
    const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    document.getElementById('log').textContent='Documento descargado.';
  }catch(e){
    console.error(e); alert('Error: '+(e.message||e)); document.getElementById('log').textContent='';
  }
}

function choiceVal(id, def=''){
  const sel=document.getElementById(id);
  if(!sel) return def;
  const v=sel.value||'';
  if(v==='__OTRO__'){
    const other=document.getElementById(id+'_otro');
    return (other && other.value.trim()) ? other.value.trim() : def;
  }
  return v.trim()||def;
}
function bindOtroToggle(id){
  const sel=document.getElementById(id);
  const other=document.getElementById(id+'_otro');
  if(!sel||!other) return;
  const sync=()=>{ other.classList.toggle('hidden', sel.value!=='__OTRO__'); };
  sel.addEventListener('change',sync); sync();
}
